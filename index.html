    <!-- Belt-and-suspenders cache control: these meta tags mirror the
         Cache-Control: no-store header in _headers. Safari on macOS reads
         these directly from the HTML parser even when it ignores HTTP headers
         or when an old service worker is intercepting network requests. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- ─── Safari Cache-Bust (sync, runs before anything else) ─────────────
         Safari (macOS + iOS PWA) freezes stale HTML in its disk cache and
         serves it even when the network has a newer version. This script runs
         synchronously before any other resource loads.
         It writes to localStorage key 'ruh-app-version'.

         ► For every deploy: update /version.json (one-liner, bottom of page).
           The async poller at the bottom of <body> detects the change and
           reloads all open tabs automatically — no need to touch this script.
         ► Only bump APP_VERSION here too if you also want the very first page
           load (before the async check fires) to redirect immediately.
         localStorage user data (diary, salawat, preferences) is never touched. -->
    <script>
      (function () {
        // ⚠️  DEPLOY CHECKLIST — bump BOTH of these on every deploy:
        //   1. APP_VERSION below          (this file, right here)
        //   2. "v" in /version.json       (one-liner at root — the async poller reads it)
        // Both must match. APP_VERSION fires synchronously on first load;
        // version.json catches open tabs and background PWA installs.
        var APP_VERSION = '2026-04-25a'; // ← YYYY-MM-DD, must match version.json "v"
        var stored = localStorage.getItem('ruh-app-version');
        if (stored !== APP_VERSION) {
          localStorage.setItem('ruh-app-version', APP_VERSION);
          if (window.location.search.indexOf('v=' + APP_VERSION) === -1) {
            window.location.replace(window.location.pathname + '?v=' + APP_VERSION);
          }
        }
      })();
    </script>

    <!-- ══════════════════════════════════════════════════════════════
         RŪḤ SOUNDSCAPE ENGINE — Web Audio API, zero external files
         All tones synthesized in-browser using oscillators, filters,
         convolver reverb, and gain envelopes. Islamic maqam tuning.
    ══════════════════════════════════════════════════════════════ -->
    <script>
    'use strict';

    window.RuhSoundscape = (() => {
        // ─── State ────────────────────────────────────────────────
        let ctx = null;
        let masterGain = null;
        let enabled = true;      // user toggle
        let initialized = false;
        let ambientFadeTimer = null; // kept as unused stub

        // ─── Islamic Maqam Rast frequencies (Hz) ─────────────────
        // Rast on C: C D E-half-flat F G A B-half-flat C
        // We approximate with 12-TET but use characteristic intervals
        const RAST = {
            C4:  261.63, D4:  293.66, Eb4: 311.13, // Eb approximates E-half-flat
            F4:  349.23, G4:  392.00, A4:  440.00,
            Bb4: 466.16, C5:  523.25, D5:  587.33,
            G3:  196.00, F3:  174.61, C3:  130.81,
            G2:  98.00,  C2:  65.41,
        };

        // ─── Bootstrap AudioContext on first user interaction ─────
        function ensureCtx() {
            if (ctx) return true;
            try {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = ctx.createGain();
                masterGain.gain.setValueAtTime(enabled ? 0.72 : 0, ctx.currentTime);
                masterGain.connect(ctx.destination);
                initialized = true;
                return true;
            } catch(e) {
                console.warn('[Rūḥ Soundscape] Web Audio not available:', e.message);
                return false;
            }
        }

        function resumeCtx() {
            if (ctx && ctx.state === 'suspended') ctx.resume();
        }

        // ─── Reverb (convolver) using impulse response synthesis ──
        let _reverb = null;
        function getReverb(decaySec = 3.2) {
            if (_reverb) return _reverb;
            if (!ctx) return null;
            const length   = Math.floor(ctx.sampleRate * decaySec);
            const impulse  = ctx.createBuffer(2, length, ctx.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const ch_data = impulse.getChannelData(ch);
                for (let i = 0; i < length; i++) {
                    ch_data[i] = (Math.random() * 2 - 1)
                        * Math.pow(1 - i / length, 2.8); // exponential decay
                }
            }
            _reverb = ctx.createConvolver();
            _reverb.buffer = impulse;
            _reverb.connect(masterGain);
            return _reverb;
        }

        // ─── Utility: create oscillator with envelope ─────────────
        function makeOsc(type, freq, gainVal, attack, decay, sustain, release, dest) {
            if (!ctx) return null;
            const osc  = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type            = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(dest || masterGain);
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(gainVal, ctx.currentTime + attack);
            gain.gain.setTargetAtTime(sustain * gainVal, ctx.currentTime + attack, decay / 3);
            osc.start();
            return { osc, gain, release };
        }

        function stopOsc(handle, fadeTime = 0.4) {
            if (!handle || !ctx) return;
            const now = ctx.currentTime;
            handle.gain.gain.cancelScheduledValues(now);
            handle.gain.gain.setTargetAtTime(0, now, fadeTime / 3);
            handle.osc.stop(now + fadeTime + 0.1);
        }

        function stopNodes(nodes, fadeTime = 2.5) {
            // kept as no-op stub — ambient removed
        }

        // ─── Tasbih bead click (for salawat/dhikr counter) ───────
        // Routed through its own DynamicsCompressor that bypasses
        // masterGain — this guarantees the click is always audible
        // regardless of how loud the ambient scene has become.
        let _clickCompressor = null;
        function getClickBus() {
            if (_clickCompressor) return _clickCompressor;
            if (!ctx) return masterGain;
            _clickCompressor = ctx.createDynamicsCompressor();
            _clickCompressor.threshold.value = -18;
            _clickCompressor.knee.value      = 12;  // wide/soft knee — no pumping
            _clickCompressor.ratio.value     = 3;
            _clickCompressor.attack.value    = 0.004;
            _clickCompressor.release.value   = 0.22; // slower — prevents rapid-tap harshness
            const clickOut = ctx.createGain();
            clickOut.gain.value = 0.62; // lowered — dhikr should be present, not loud
            _clickCompressor.connect(clickOut);
            clickOut.connect(ctx.destination);
            return _clickCompressor;
        }

        // ─── Mood Bus ─────────────────────────────────────────────
        // Mood response sounds bypass masterGain entirely — same principle
        // as the click bus — so the ambient never masks them.
        // A dedicated compressor provides transparent limiting.
        let _moodBus = null;
        function getMoodBus() {
            if (_moodBus) return _moodBus;
            if (!ctx) return masterGain;
            _moodBus = ctx.createDynamicsCompressor();
            _moodBus.threshold.value = -14;
            _moodBus.knee.value      = 8;
            _moodBus.ratio.value     = 3;
            _moodBus.attack.value    = 0.003;
            _moodBus.release.value   = 0.30;
            const moodOut = ctx.createGain();
            moodOut.gain.value = 1.55; // raised — moods must cut through ambient
            _moodBus.connect(moodOut);
            moodOut.connect(ctx.destination); // bypass masterGain
            return _moodBus;
        }

        // ─── Ambient Ducking ──────────────────────────────────────
        // Briefly lowers masterGain so mood sounds (on their own bus) have
        // the sonic spotlight. Ramps back smoothly after holdSecs.
        function duckAmbient(holdSecs = 5.0) {
            if (!ctx || !masterGain || !enabled) return;
            const now = ctx.currentTime;
            masterGain.gain.cancelScheduledValues(now);
            masterGain.gain.setValueAtTime(masterGain.gain.value, now);
            masterGain.gain.linearRampToValueAtTime(0.10, now + 0.30);  // duck quickly
            masterGain.gain.setValueAtTime(0.10, now + holdSecs);
            masterGain.gain.linearRampToValueAtTime(1.0,  now + holdSecs + 2.0); // restore
        }

        function playBeadClick() {
            if (!ctx || !enabled) return;
            resumeCtx();
            const now = ctx.currentTime;
            const bus = getClickBus();
            const rev = getReverb(2.8);

            // A misbaha bead passing through fingers: warm, rounded, low-mid.
            // No noise transient — just a soft sine with a gentle bow-shaped
            // attack and a long natural tail, like wood kissing wood quietly.

            // Fundamental — G4 (392Hz): warm enough to feel physical,
            // high enough to sit above the ambient drone.
            const osc  = ctx.createOscillator();
            const gain = ctx.createGain();
            const lp   = ctx.createBiquadFilter();
            lp.type = 'lowpass'; lp.frequency.value = 2200;
            osc.type = 'sine'; osc.frequency.value = 392.00;
            osc.connect(lp); lp.connect(gain);
            if (rev) gain.connect(rev);
            gain.connect(bus);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.28, now + 0.007); // brief, soft attack
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.38); // smooth tail
            osc.start(now); osc.stop(now + 0.45);

            // Bell partial — adds the faint wooden resonance
            const osc2  = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine'; osc2.frequency.value = 392.00 * 2.1; // wood overtone ~823Hz
            osc2.connect(gain2);
            if (rev) gain2.connect(rev);
            gain2.connect(bus);
            gain2.gain.setValueAtTime(0, now);
            gain2.gain.linearRampToValueAtTime(0.07, now + 0.005);
            gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
            osc2.start(now); osc2.stop(now + 0.22);
        }

        // ─── Counter reset sound ──────────────────────────────────
        // A descending fifth (A3 → D3) — like sweeping a tasbih clean.
        // Respectful closure, not an error sound. A breath follows.
        function playCounterReset() {
            if (!ctx || !enabled) return;
            resumeCtx();
            const rev = getReverb(3.2);
            const now = ctx.currentTime;

            [{ f: 220.00, t: 0,    g: 0.10  },
             { f: 146.83, t: 0.38, g: 0.075 }].forEach(({ f, t, g }) => {
                const ts = now + t;
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type   = 'sine'; osc.frequency.value = f;
                osc.connect(gain); if (rev) gain.connect(rev); gain.connect(masterGain);
                gain.gain.setValueAtTime(0, ts);
                gain.gain.linearRampToValueAtTime(g, ts + 0.014);
                gain.gain.exponentialRampToValueAtTime(0.0001, ts + 2.2);
                osc.start(ts); osc.stop(ts + 2.6);
                // Bell partial (2.756× fundamental for handpan character)
                const osc2  = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type   = 'sine'; osc2.frequency.value = f * 2.756;
                osc2.connect(gain2); if (rev) gain2.connect(rev); gain2.connect(masterGain);
                gain2.gain.setValueAtTime(0, ts);
                gain2.gain.linearRampToValueAtTime(g * 0.30, ts + 0.012);
                gain2.gain.exponentialRampToValueAtTime(0.0001, ts + 1.0);
                osc2.start(ts); osc2.stop(ts + 1.4);
            });

            // Breath exhale after the notes — the reset feels like
            // a complete, quiet exhale before a fresh start
            const es   = now + 0.6;
            const eSz  = Math.floor(ctx.sampleRate * 1.4);
            const eBuf = ctx.createBuffer(1, eSz, ctx.sampleRate);
            const eD   = eBuf.getChannelData(0);
            for (let i = 0; i < eSz; i++)
                eD[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / eSz);
            const eSrc  = ctx.createBufferSource();
            eSrc.buffer = eBuf;
            const eLp   = ctx.createBiquadFilter();
            eLp.type    = 'lowpass'; eLp.frequency.value = 900;
            const eGain = ctx.createGain();
            eGain.gain.setValueAtTime(0, es);
            eGain.gain.linearRampToValueAtTime(0.038, es + 0.35);
            eGain.gain.linearRampToValueAtTime(0, es + 1.3);
            eSrc.connect(eLp); eLp.connect(eGain); eGain.connect(masterGain);
            eSrc.start(es); eSrc.stop(es + 1.5);
        }

        // ─── Milestone chime (every 10 salawat) ──────────────────
        // Five notes rise very slowly — like a distant minaret bell,
        // not a celebration. The spacing and reverb carry more weight
        // than the volume. Dhikr milestones are met with stillness.
        function playMilestoneChime() {
            if (!ctx || !enabled) return;
            resumeCtx();
            const rev = getReverb(4.5);
            const now = ctx.currentTime;
            // Pentatonic arpeggio ascending: G3 C4 Eb4 G4 C5
            const notes = [RAST.G3, RAST.C4, RAST.Eb4, RAST.G4, RAST.C5];
            notes.forEach((freq, i) => {
                const t    = now + i * 0.38; // slower — one note settles before the next
                const gVal = Math.max(0.07 - i * 0.006, 0.04); // descends gently
                // Fundamental
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq;
                osc.connect(gain);
                if (rev) gain.connect(rev);
                gain.connect(masterGain);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(gVal, t + 0.014);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
                osc.start(t); osc.stop(t + 2.6);
                // Bell partial — quieter than before
                const osc2  = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'sine'; osc2.frequency.value = freq * 2.756;
                osc2.connect(gain2);
                if (rev) gain2.connect(rev);
                gain2.connect(masterGain);
                gain2.gain.setValueAtTime(0, t);
                gain2.gain.linearRampToValueAtTime(gVal * 0.28, t + 0.010);
                gain2.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
                osc2.start(t); osc2.stop(t + 1.4);
            });
        }

        // ─── Navigation transition whisper ────────────────────────
        function playNavChime(screenName) {
            if (!ctx || !enabled) return;
            resumeCtx();
            const now  = ctx.currentTime;
            // Different subtle tones per screen
            const screenTones = {
                home:           [RAST.G3,  RAST.C4],
                verse:          [RAST.C4,  RAST.G4],
                journey:        [RAST.F3,  RAST.C4],
                salawat:        [RAST.G3,  RAST.D4],
                protection:     [RAST.F3,  RAST.Bb4],
                diary:          [RAST.C4,  RAST.F4],
                prophet_detail: [RAST.G3,  RAST.Eb4],
            };
            const tones = screenTones[screenName] || [RAST.C4, RAST.G4];
            tones.forEach((freq, i) => {
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                const t    = now + i * 0.12;
                osc.type   = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(masterGain);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.042, t + 0.016);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
                osc.start(t);
                osc.stop(t + 0.7);
            });
        }

        // ─── Entry save sound (pen on paper) ──────────────────────
        function playSaveSound() {
            if (!ctx || !enabled) return;
            resumeCtx();
            const now = ctx.currentTime;
            // Short soft scratch + confirming tone
            const bufSize = Math.floor(ctx.sampleRate * 0.08);
            const buf     = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const data    = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.25)) * 0.5;
            }
            const src  = ctx.createBufferSource();
            src.buffer = buf;
            const bp   = ctx.createBiquadFilter();
            bp.type    = 'bandpass';
            bp.frequency.value = 3500;
            bp.Q.value = 1.2;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.18, now);
            src.connect(bp); bp.connect(gain); gain.connect(masterGain);
            src.start(now); src.stop(now + 0.1);

            // Confirming gentle tone
            const osc  = ctx.createOscillator();
            const gn   = ctx.createGain();
            osc.type   = 'sine';
            osc.frequency.value = RAST.G4;
            osc.connect(gn); gn.connect(masterGain);
            gn.gain.setValueAtTime(0, now + 0.06);
            gn.gain.linearRampToValueAtTime(0.055, now + 0.10);
            gn.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
            osc.start(now + 0.06); osc.stop(now + 0.8);
        }

        // ─── Launch screen opening tone ───────────────────────────
        function playLaunchTone() {
            if (!ctx || !enabled) return;
            resumeCtx();
            const rev = getReverb(4.5);
            const now = ctx.currentTime;
            // Deep C drone rises gently — feels like a sanctuary opening
            const rootFreq = RAST.C3;
            const partials = [
                { f: rootFreq,         g: 0.055, t: 0.0  },
                { f: rootFreq * 1.5,   g: 0.028, t: 0.6  },
                { f: rootFreq * 2,     g: 0.018, t: 1.2  },
                { f: rootFreq * 0.75,  g: 0.042, t: 0.3  }, // low fifth
            ];
            partials.forEach(p => {
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type   = 'sine';
                osc.frequency.value = p.f;
                osc.connect(gain);
                if (rev) gain.connect(rev);
                gain.connect(masterGain);
                gain.gain.setValueAtTime(0, now + p.t);
                gain.gain.linearRampToValueAtTime(p.g, now + p.t + 1.4);
                gain.gain.setTargetAtTime(0, now + 2.4, 0.6);
                osc.start(now + p.t);
                osc.stop(now + 5.5);
            });
        }

        // ─── Daily verse reveal tone ──────────────────────────────
        function playVerseReveal() {
            if (!ctx || !enabled) return;
            resumeCtx();
            const rev = getReverb(5.0);
            const now = ctx.currentTime;
            // Floating high tones — like light entering a room
            const sequence = [
                { f: RAST.G4,  t: 0,    g: 0.05  },
                { f: RAST.C5,  t: 0.4,  g: 0.038 },
                { f: RAST.Eb4, t: 0.75, g: 0.028 },
                { f: RAST.G4,  t: 1.1,  g: 0.022 },
            ];
            sequence.forEach(s => {
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type   = 'sine';
                osc.frequency.value = s.f;
                osc.connect(gain);
                if (rev) gain.connect(rev);
                gain.connect(masterGain);
                gain.gain.setValueAtTime(0, now + s.t);
                gain.gain.linearRampToValueAtTime(s.g, now + s.t + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + s.t + 2.8);
                osc.start(now + s.t);
                osc.stop(now + s.t + 3.2);
            });
        }

        // ─── Quest complete sound ──────────────────────────────────
        function playQuestComplete() {
            if (!ctx || !enabled) return;
            resumeCtx();
            const rev = getReverb(3);
            const now = ctx.currentTime;
            // Ascending major pentatonic with warmth
            [RAST.C4, RAST.Eb4, RAST.G4, RAST.C5].forEach((freq, i) => {
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                const t    = now + i * 0.18;
                osc.type   = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                if (rev) gain.connect(rev);
                gain.connect(masterGain);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.09 - i * 0.008, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
                osc.start(t);
                osc.stop(t + 1.8);
            });
        }

        // ─── Time-of-Day Profile ──────────────────────────────────
        // Returns { gainMult, filterMult, reverbMult } based on prayer windows.
        // Fajr (3–6h): most sacred — quietest, longest reverb
        // Dhuhr–Asr (11–17h): standard baseline
        // Maghrib (17–20h): warm golden-hour quality
        // Isha–Tahajjud (20–3h): intimate night mode
        function getTimeOfDayProfile() {
            // ── Adhan.js prayer-time-aware profile ───────────────────
            // Uses stored coordinates for globally-accurate prayer windows.
            // If no location has been saved, falls back to approximate hours.
            try {
                const stored = localStorage.getItem('ruh_user_coords');
                if (stored && window.adhan) {
                    const parsed  = JSON.parse(stored);
                    const coords  = new adhan.Coordinates(parsed.lat, parsed.lng);
                    // Use the correct regional authority method (not a global default)
                    const { method } = typeof getCalcMethod === 'function'
                        ? getCalcMethod(parsed)
                        : { method: adhan.CalculationMethod.MuslimWorldLeague() };
                    const pt      = new adhan.PrayerTimes(coords, new Date(), method);
                    const now     = Date.now();
                    const fajr    = pt.fajr.getTime();
                    const sunrise = pt.sunrise.getTime();
                    const dhuhr   = pt.dhuhr.getTime();
                    const asr     = pt.asr.getTime();
                    const maghrib = pt.maghrib.getTime();
                    const isha    = pt.isha.getTime();
                    if (now >= fajr    && now < sunrise) return { gainMult: 0.55, filterMult: 0.75, reverbMult: 1.35 }; // Fajr
                    if (now >= sunrise && now < dhuhr)   return { gainMult: 0.88, filterMult: 0.95, reverbMult: 1.10 }; // Morning
                    if (now >= dhuhr   && now < asr)     return { gainMult: 1.00, filterMult: 1.00, reverbMult: 1.00 }; // Midday
                    if (now >= asr     && now < maghrib) return { gainMult: 0.95, filterMult: 0.98, reverbMult: 1.05 }; // Asr
                    if (now >= maghrib && now < isha)    return { gainMult: 0.92, filterMult: 0.90, reverbMult: 1.18 }; // Maghrib
                    return                               { gainMult: 0.70, filterMult: 0.80, reverbMult: 1.25 }; // Isha/Night
                }
            } catch(_) {}
            // ── Fallback: approximate hours (equatorial/subtropical) ─
            const h = new Date().getHours();
            if (h >= 3  && h <  6)  return { gainMult: 0.55, filterMult: 0.75, reverbMult: 1.35 }; // Fajr
            if (h >= 6  && h < 11)  return { gainMult: 0.88, filterMult: 0.95, reverbMult: 1.10 }; // Morning
            if (h >= 11 && h < 17)  return { gainMult: 1.00, filterMult: 1.00, reverbMult: 1.00 }; // Midday/Asr
            if (h >= 17 && h < 20)  return { gainMult: 0.92, filterMult: 0.90, reverbMult: 1.18 }; // Maghrib
            return                         { gainMult: 0.70, filterMult: 0.80, reverbMult: 1.25 }; // Isha/Night
        }

        // ─── Session-Length Gain ──────────────────────────────────
        // Micro-interaction sounds gradually soften over a long session.
        // Ambient and milestone sounds are unaffected — only interactions.
        let sessionStartTime = Date.now();
        function getSessionInteractionGain() {
            const mins = (Date.now() - sessionStartTime) / 60000;
            if (mins < 5)  return 1.00;
            if (mins < 15) return 0.72;
            if (mins < 30) return 0.48;
            return 0.30; // deep practice — very subtle
        }

        // ─── Noise Breath ──────────────────────────────────────────
        function playBreathPuff(gainVal = 0.055, durationSec = 0.6) {
            if (!ctx) return;
            const now     = ctx.currentTime;
            const prof    = getTimeOfDayProfile();
            const bufSize = Math.floor(ctx.sampleRate * durationSec);
            const buf     = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const data    = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) {
                data[i] = (Math.random() * 2 - 1)
                    * Math.sin(Math.PI * i / bufSize) // smooth envelope
                    * Math.exp(-i / (bufSize * 0.55));
            }
            const src  = ctx.createBufferSource();
            src.buffer = buf;
            const lp   = ctx.createBiquadFilter();
            lp.type    = 'lowpass';
            lp.frequency.value = 1200 * prof.filterMult;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(gainVal * prof.gainMult, now);
            src.connect(lp); lp.connect(gain); gain.connect(masterGain);
            src.start(now); src.stop(now + durationSec + 0.1);
        }

        // ─── Mood Response Sounds ─────────────────────────────────
        // All 9 moods share the same calming handpan-like character:
        // a clean sine fundamental with a soft quick attack, long
        // exponential decay, gentle reverb, and a barely-there upper
        // partial for warmth. What differs is the pitch / interval —
        // the sonic "colour" of each emotional state — never the volume
        // or aggressive timbre. Every sound passes the sakīnah test:
        // it acknowledges the feeling without amplifying it.

        // Shared helper: strike a handpan-like tone at `freq`.
        // gainVal: peak amplitude  |  decay: seconds to silence
        // delay: time offset from now  |  bus: output node
        function handpanTone(freq, gainVal, decay, delay, bus) {
            if (!ctx) return;
            const rev = getReverb(5.0);
            const t   = ctx.currentTime + delay;
            const lp  = ctx.createBiquadFilter();
            lp.type   = 'lowpass'; lp.frequency.value = 2400;
            // Fundamental
            const o1  = ctx.createOscillator();
            const g1  = ctx.createGain();
            o1.type   = 'sine'; o1.frequency.value = freq;
            o1.connect(lp); lp.connect(g1);
            if (rev) g1.connect(rev);
            g1.connect(bus);
            g1.gain.setValueAtTime(0, t);
            g1.gain.linearRampToValueAtTime(gainVal, t + 0.022);
            g1.gain.exponentialRampToValueAtTime(0.0001, t + decay);
            o1.start(t); o1.stop(t + decay + 0.2);
            // Warm partial (2.1× — handpan wood overtone)
            const o2  = ctx.createOscillator();
            const g2  = ctx.createGain();
            o2.type   = 'sine'; o2.frequency.value = freq * 2.1;
            o2.connect(g2);
            if (rev) g2.connect(rev);
            g2.connect(bus);
            g2.gain.setValueAtTime(0, t);
            g2.gain.linearRampToValueAtTime(gainVal * 0.20, t + 0.018);
            g2.gain.exponentialRampToValueAtTime(0.0001, t + decay * 0.5);
            o2.start(t); o2.stop(t + decay * 0.55);
        }

        function playMoodResponse(moodKey) {
            if (!ctx || !enabled) return;
            resumeCtx();
            const bus  = getMoodBus();
            const prof = getTimeOfDayProfile();
            const gm   = Math.max(prof.gainMult, 0.78);
            // No ambient to duck (background is silence), but keep the
            // duckAmbient call as a no-op for forward compatibility.
            duckAmbient(8.0);

            // Base gain for all moods — present but never startling
            const G = 0.22 * gm;

            switch (moodKey) {

                case 'grateful': {
                    // D4 — warm, open, thankful.
                    // A single clear tone that rings forward, then a
                    // quiet echo a fifth lower (A3) after 1.6 s.
                    handpanTone(293.66, G,        4.5, 0.0, bus); // D4
                    handpanTone(220.00, G * 0.65, 4.5, 1.6, bus); // A3 echo
                    break;
                }

                case 'hopeful': {
                    // G3 rising to A3 — two tones a step apart,
                    // played slowly: a gentle upward breath.
                    handpanTone(196.00, G,        4.0, 0.0, bus); // G3
                    handpanTone(220.00, G * 0.75, 4.0, 1.2, bus); // A3
                    break;
                }

                case 'atpeace': {
                    // D3 alone — the quietest mood.
                    // Just one low tone, very soft, long tail.
                    // Barely present, like a slow exhale.
                    handpanTone(146.83, G * 0.70, 5.5, 0.0, bus); // D3
                    break;
                }

                case 'anxious': {
                    // F3 — grounding, not cheerful.
                    // One tone, then a 1.8 s rest of silence,
                    // then a soft C3 beneath it: earth underfoot.
                    handpanTone(174.61, G * 0.80, 3.5, 0.0, bus); // F3
                    handpanTone(130.81, G * 0.55, 5.0, 2.0, bus); // C3 ground
                    break;
                }

                case 'grieving': {
                    // D3 with a 5 Hz vibrato depth of 5 cents —
                    // same pitch as atpeace but with a slight trembling.
                    // Acknowledges the grief without resolving it.
                    const rev = getReverb(5.5);
                    const t   = ctx.currentTime;
                    const lp  = ctx.createBiquadFilter();
                    lp.type   = 'lowpass'; lp.frequency.value = 2000;
                    const o   = ctx.createOscillator();
                    const g   = ctx.createGain();
                    const vib = ctx.createOscillator();
                    const vg  = ctx.createGain();
                    vib.frequency.value = 5.0; vg.gain.value = 5;
                    vib.connect(vg); vg.connect(o.detune);
                    o.type = 'sine'; o.frequency.value = 146.83;
                    o.connect(lp); lp.connect(g);
                    if (rev) g.connect(rev);
                    g.connect(bus);
                    g.gain.setValueAtTime(0, t);
                    g.gain.linearRampToValueAtTime(G * 0.75, t + 0.6);
                    g.gain.linearRampToValueAtTime(G * 0.75, t + 3.2);
                    g.gain.setTargetAtTime(0, t + 3.2, 0.9);
                    o.start(t); o.stop(t + 6.5);
                    vib.start(t); vib.stop(t + 6.5);
                    break;
                }

                case 'angry': {
                    // C3 — deep, resonant, single bowl-like strike.
                    // Long 6-second decay. The vibration is the message.
                    handpanTone(130.81, G * 1.10, 6.5, 0.0, bus); // C3
                    break;
                }

                case 'ashamed': {
                    // A3 — the softest possible touch.
                    // Barely-audible single tone: approaching with humility.
                    handpanTone(220.00, G * 0.55, 4.0, 0.0, bus); // A3
                    break;
                }

                case 'overwhelmed': {
                    // C3 + G3 — a perfect fifth, played simultaneously.
                    // Stable, consonant, spacious. Like finding solid ground.
                    handpanTone(130.81, G * 0.75, 5.0, 0.0, bus); // C3
                    handpanTone(196.00, G * 0.60, 5.0, 0.0, bus); // G3
                    break;
                }

                case 'lonely': {
                    // D3, then A3 one second later — a perfect fifth played
                    // apart rather than together. Separate, but connected.
                    handpanTone(146.83, G,        4.5, 0.0, bus); // D3
                    handpanTone(220.00, G * 0.80, 4.5, 1.1, bus); // A3
                    break;
                }

                default: break;
            }
        }

        // ─── Scene management (ambient removed — silence is the backdrop) ──
        function stopAmbient() {}  // no-op stub
        function setScene() {}     // no-op stub

        // ─── Public API ───────────────────────────────────────────
        return {
            // Call on first user interaction (before any sound)
            init() {
                if (!ensureCtx()) return false;
                resumeCtx();
                return true;
            },

            // Launch screen opens
            onLaunch() {
                if (!ensureCtx()) return;
                resumeCtx();
                setTimeout(() => playLaunchTone(), 600);
            },

            // Daily verse full-screen appears
            onDailyVerseShow() {
                if (!ensureCtx() || !enabled) return;
                resumeCtx();
                playVerseReveal();
            },

            // User navigates to a new screen
            onNavigate(screenName) {
                if (!ensureCtx() || !enabled) return;
                resumeCtx();
                playNavChime(screenName);
                setScene(screenName);
            },

            // User taps the salawat/dhikr counter
            onBeadClick() {
                if (!ensureCtx() || !enabled) return;
                resumeCtx();
                playBeadClick();
            },

            // User resets the salawat counter
            onCounterReset() {
                if (!ensureCtx() || !enabled) return;
                resumeCtx();
                playCounterReset();
            },

            // Every 10 salawat milestone
            onMilestone() {
                if (!ensureCtx() || !enabled) return;
                resumeCtx();
                playMilestoneChime();
            },

            // Journal entry saved
            onSave() {
                if (!ensureCtx() || !enabled) return;
                resumeCtx();
                playSaveSound();
            },

            // Daily quest completed
            onQuestComplete() {
                if (!ensureCtx() || !enabled) return;
                resumeCtx();
                playQuestComplete();
            },

            // Toggle sound on/off
            toggle() {
                enabled = !enabled;
                if (ctx && masterGain) {
                    const now = ctx.currentTime;
                    masterGain.gain.cancelScheduledValues(now);
                    if (enabled) {
                        masterGain.gain.linearRampToValueAtTime(0.72, now + 0.8);
                    } else {
                        masterGain.gain.linearRampToValueAtTime(0, now + 1.2);
                    }
                }
                // Persist preference
                try { localStorage.setItem('ruh_sound_enabled', JSON.stringify(enabled)); } catch(_) {}
                return enabled;
            },

            isEnabled() { return enabled; },

            // Mood response — call when user selects an emotional state
            onMood(moodKey) {
                if (!ensureCtx() || !enabled) return;
                resumeCtx();
                playMoodResponse(moodKey);
            },

            // Reset session timer (call on app focus / resume)
            resetSession() { sessionStartTime = Date.now(); },

            // Read persisted preference
            loadPreference() {
                try {
                    const stored = localStorage.getItem('ruh_sound_enabled');
                    if (stored !== null) enabled = JSON.parse(stored);
                } catch(_) {}
                return enabled;
            },
        };
    })();

            aladhanMethodId: 3,
            source: 'aligned',

        function resolvePrayerRegion(coords) {
            const label = (coords?.label || '').toLowerCase();
            for (const rule of PRAYER_REGION_RULES) {
                if ((rule.aliases && labelIncludes(label, rule.aliases))
                    || (rule.bounds && withinBounds(coords, rule.bounds))) {
                    return rule;
                }
            }
            return DEFAULT_PRAYER_REGION;
        }

        // ── Calculation Method Mapper ─────────────────────────────────
        // Uses the same region resolver as the network fetcher so the
        // calculated fallback stays aligned with the chosen authority.
        function getCalcMethod(coords) {
            if (!window.adhan) return { method: null, authority: 'Unknown', source: 'calculated' };
            const region = resolvePrayerRegion(coords);
            return {
                method: region.calcMethod(),
                authority: region.authority,
                source: region.source,
            };
        }

        // ── Prayer Times Display Helper (Adhan.js) ───────────────────
        // Returns the 5 daily prayer times for a given coords object.
        // Uses the correct regional authority's calculation method per city.
        // Returns null if Adhan.js isn't loaded or coords are unavailable.
        function getPrayerTimesForDisplay(coords, baseDate = new Date()) {
            if (!coords) return null;
            if (isSingapore(coords)) {
                const official = getMUISTimes(baseDate);
                if (official) return official;
            }
            if (!window.adhan) return null;
            try {
                const c              = new adhan.Coordinates(coords.lat, coords.lng);
                const { method, authority } = getCalcMethod(coords);
                const pt             = new adhan.PrayerTimes(c, new Date(baseDate), method);
                const fmt            = (d) => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                return {
                    source: 'calculated',
                    authority,
                    prayers: [
                        { name: 'Fajr',    time: pt.fajr.getTime(),    str: fmt(pt.fajr)    },
                        { name: 'Dhuhr',   time: pt.dhuhr.getTime(),   str: fmt(pt.dhuhr)   },
                        { name: 'Asr',     time: pt.asr.getTime(),     str: fmt(pt.asr)     },
                        { name: 'Maghrib', time: pt.maghrib.getTime(), str: fmt(pt.maghrib) },
                        { name: 'Isha',    time: pt.isha.getTime(),    str: fmt(pt.isha)    },
                    ]
                };

        // Returns true if coords are within Singapore bounds
        function isSingapore(coords) {
            if (!coords) return false;
            const l = coords.label ? coords.label.toLowerCase() : '';
            if (l.includes('singapore')) return true;
            // GPS bounding box
            return coords.lat > 1.1 && coords.lat < 1.5 && coords.lng > 103.6 && coords.lng < 104.1;
        }

        // Reads today's prayer times from the embedded MUIS 2026 timetable.
        // The table stores times as integers: 824 → 8:24, 1310 → 13:10.
        function getMUISTimes(baseDate = new Date()) {
            const target = new Date(baseDate);
            const key = `${target.getDate()}/${target.getMonth() + 1}`;
            const row = MUIS_2026[key];
            if (!row) return null;

            // row: [Subuh, Syuruk, Zohor, Asr, Maghrib, Isyak] as integers
            // The PDF encodes times as H MM integers, e.g. 551=5:51, 113=1:13 (=13:13), 715=7:15 (=19:15)
            // Rule: pad to 4 digits → hhmm. If h < 5 for a non-Fajr prayer, it's PM — add 12.
            const toHHMM = (n, isFajr) => {
                const s = String(n).padStart(4, '0');
                let h = parseInt(s.slice(0, 2), 10);
                const m = parseInt(s.slice(2), 10);
                // PM correction: any non-Fajr hour under 12 is actually h+12
                // (Fajr is always before sunrise; Zohor/Asr/Maghrib/Isha are all PM in Singapore)
                // Use h < 12 (not h < 8) so Isyak at 20:xx (stored as 8xx) is correctly corrected.
                if (!isFajr && h < 12) h += 12;
                return { h, m };
            };
            const toDate = ({ h, m }) => {
                const d = new Date(target);
                d.setHours(h, m, 0, 0);
                return d;
            };
            const fmt = ({ h, m }) => toDate({ h, m }).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const names = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            // Indices in row: 0=Subuh, 1=Syuruk(skip), 2=Zohor, 3=Asar, 4=Maghrib, 5=Isyak
            const prayerIndices = [0, 2, 3, 4, 5];
            const prayers = names.map((name, i) => {
                const hm = toHHMM(row[prayerIndices[i]], i === 0); // i===0 is Fajr
                return { name, time: toDate(hm).getTime(), str: fmt(hm) };
            });

            try {
                localStorage.setItem('ruh_pt_soundscape', JSON.stringify(
                    prayers.map(p => ({ name: p.name, time: p.time }))
                ));
            } catch(_) {}

            return { source: 'official', authority: 'MUIS (Singapore)', prayers };
        }

        function getJakimZone(coords) {
            const label = (coords?.label || '').toLowerCase();
            if (label.includes('penang') || label.includes('pulau pinang')) return 'PNG01';
            if (label.includes('johor')) return 'JHR01';
            if (label.includes('melaka') || label.includes('malacca')) return 'MLK01';
            if (label.includes('selangor')) return 'SGR01';
            if (label.includes('perak')) return 'PRK01';
            if (label.includes('kedah')) return 'KDH01';
            if (label.includes('kelantan')) return 'KTN01';
            if (label.includes('pahang')) return 'PHG01';
            if (label.includes('terengganu')) return 'TRG01';
            if (label.includes('negeri sembilan') || label.includes('n9')) return 'NSN01';
            return 'WLY01';
        }

        // • Malaysia  → JAKIM e-Solat API
        // • Others    → authority-aligned Aladhan method for that region
        // Returns { source:'official'|'aligned'|'calculated', authority, prayers:[{name,time,str}] }
        // Throws on network/API error — caller should fall back to Adhan.js.
        async function fetchPrayerTimesFromAPI(coords) {
            const region = resolvePrayerRegion(coords);

            // ── Singapore: use embedded MUIS timetable (no network needed) ──────
            if (region.key === 'SG') {
                const result = getMUISTimes();
                if (result) return result;
                // Fallback to Aladhan if date not found (shouldn't happen for 2026)
            }

            // ── Malaysia: fetch from JAKIM e-solat API ────────────────────────
            // e-solat.gov.my hosts the official JAKIM waktu solat dataset.
            if (region.key === 'MY') {
                try {
                    const zone = getJakimZone(coords);
                    const today = new Date();
                    const url = `https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&period=today&zone=${zone}`;
                    const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
                    if (!res.ok) throw new Error(`JAKIM HTTP ${res.status}`);
                    const json = await res.json();
                    const t = json.prayerTime && json.prayerTime[0];
                    if (!t) throw new Error('JAKIM API: no data');

                    const toDate = (hhmm) => {
                        const [h, m] = hhmm.split(':').map(Number);
                        const d = new Date(today);
                        d.setHours(h, m, 0, 0);
                        return d;
                    };
                    const fmt = (hhmm) => toDate(hhmm).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    const prayers = [
                        { name: 'Fajr',    time: toDate(t.fajr).getTime(),    str: fmt(t.fajr)    },
                        { name: 'Dhuhr',   time: toDate(t.dhuhr).getTime(),   str: fmt(t.dhuhr)   },
                        { name: 'Asr',     time: toDate(t.asr).getTime(),     str: fmt(t.asr)     },
                        { name: 'Maghrib', time: toDate(t.maghrib).getTime(), str: fmt(t.maghrib) },
                        { name: 'Isha',    time: toDate(t.isha).getTime(),    str: fmt(t.isha)    },
                    ];
                    try {
                        localStorage.setItem('ruh_pt_soundscape', JSON.stringify(
                            prayers.map(p => ({ name: p.name, time: p.time }))
                        ));
                    } catch(_) {}
                    return { source: 'official', authority: `JAKIM (${zone})`, prayers };
                } catch(_) {
                    // Fall through to Aladhan
                }
            }

            // ── All other regions: authority-aligned Aladhan fallback ─────────
            const methodId = region.aladhanMethodId || getAladhanMethodId(coords);
            const url = `https://api.aladhan.com/v1/timings?latitude=${coords.lat}&longitude=${coords.lng}&method=${methodId}`;
            const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            if (json.code !== 200) throw new Error('Aladhan API error');

            const t = json.data.timings;
            const today = new Date();
            const toDate = (hhmm) => {
                const [h, m] = hhmm.split(':').map(Number);
                const d = new Date(today);
                d.setHours(h, m, 0, 0);
                return d;
            };
            const fmt = (hhmm) => toDate(hhmm).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const prayers = [
                { name: 'Fajr',    time: toDate(t.Fajr).getTime(),    str: fmt(t.Fajr)    },
                { name: 'Dhuhr',   time: toDate(t.Dhuhr).getTime(),   str: fmt(t.Dhuhr)   },
                { name: 'Asr',     time: toDate(t.Asr).getTime(),     str: fmt(t.Asr)     },
                { name: 'Maghrib', time: toDate(t.Maghrib).getTime(), str: fmt(t.Maghrib) },
                { name: 'Isha',    time: toDate(t.Isha).getTime(),    str: fmt(t.Isha)    },
            ];
            try {
                localStorage.setItem('ruh_pt_soundscape', JSON.stringify(
                    prayers.map(p => ({ name: p.name, time: p.time }))
                ));
            } catch(_) {}
            return {
                source: 'aligned',
                authority: region.authority || ALADHAN_AUTHORITIES[methodId] || 'Authority-aligned method',
                prayers,
            };
        }

            if (nextIdx !== -1) return result.prayers[nextIdx];

        const PUSH_CONFIG_ENDPOINT = '/.netlify/functions/push-config';
        const PUSH_SUBSCRIPTION_ENDPOINT = '/.netlify/functions/push-subscription';
        let pushConfigPromise = null;

        function isPrayerNotificationSupported() {
            return window.isSecureContext
                && 'serviceWorker' in navigator
                && 'PushManager' in window
                && 'Notification' in window;

        function isAppleMobileDevice() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        function isStandaloneDisplayMode() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            return Uint8Array.from([...rawData].map((char) => char.charCodeAt(0)));
        }

        async function fetchPushConfig() {
            if (!pushConfigPromise) {
                pushConfigPromise = fetch(PUSH_CONFIG_ENDPOINT, { cache: 'no-store' })
                    .then(async (response) => {
                        const payload = await response.json().catch(() => ({}));
                        if (!response.ok || !payload?.configured || !payload?.vapidPublicKey) {
                            throw new Error(payload?.error || 'Push configuration is missing.');
                        }
                        return payload;
                    });
            }

            return pushConfigPromise;
        }

        async function getPrayerNotificationPermissionStatus() {
            if (!isPrayerNotificationSupported()) return 'unsupported';
            if (Notification.permission === 'default') return 'prompt';
            return Notification.permission;
        }

        async function requestPrayerNotificationPermission() {
            if (!isPrayerNotificationSupported()) return { status: 'unsupported', granted: false };
            const status = await Notification.requestPermission();
            return {
                status: status === 'default' ? 'prompt' : status,
                granted: status === 'granted',
            };
        }

        async function ensurePrayerPushSubscription() {
            if (!isPrayerNotificationSupported()) return null;

            const registration = await navigator.serviceWorker.ready;
            const existing = await registration.pushManager.getSubscription();
            if (existing) return existing;

            const config = await fetchPushConfig();
            return registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(config.vapidPublicKey),
            });
        }

        async function syncWebPrayerNotifications({ reminders, userCoords, enabled, permission }) {
            const subscription = await ensurePrayerPushSubscription();
            if (!subscription) throw new Error('Push subscription is unavailable.');

            const payload = {
                subscription: subscription.toJSON(),
                enabled: !!enabled,
                permission,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null,
                locationLabel: userCoords?.label || null,
                standalone: isStandaloneDisplayMode(),
                origin: window.location.origin,
                platform: {
                    userAgent: navigator.userAgent,
                    language: navigator.language || null,
                },
                reminders: Array.isArray(reminders)
                    ? reminders.map((reminder) => ({
                        ...reminder,
                        screen: reminder.screen || 'home',
                        tag: reminder.tag || reminder.id,
                        url: reminder.url || `/?screen=home&reminder=${encodeURIComponent(reminder.id)}`,
                    }))
                    : [],
            };

            const response = await fetch(PUSH_SUBSCRIPTION_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload),
            });

            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(result?.error || 'Could not sync prayer reminders.');
            }

            return result;
        }

        async function cancelPrayerNotifications() {
            if (!('serviceWorker' in navigator)) return false;

            const registration = await navigator.serviceWorker.ready;
            const subscription = await registration.pushManager.getSubscription();

            if (subscription) {
                await fetch(PUSH_SUBSCRIPTION_ENDPOINT, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        subscription: subscription.toJSON(),
                    }),
                }).catch(() => null);

                try {
                    await subscription.unsubscribe();
                } catch (_) {
                    return false;
                }
            }

            return true;

        function stablePick(options, seed) {
            if (!Array.isArray(options) || options.length === 0) return '';
            let hash = 0;
            const text = String(seed || '');
            for (let i = 0; i < text.length; i += 1) {
                hash = ((hash << 5) - hash) + text.charCodeAt(i);
                hash |= 0;
            }
            return options[Math.abs(hash) % options.length];
        }

        function formatPromptWithRef(prompt) {
            if (!prompt) return '';

        function buildPrayerNotificationReminders({ prayerResults, locationLabel }) {
            const now = Date.now();
            const allPrayers = Array.isArray(prayerResults)
                ? prayerResults.flatMap((result) => result?.prayers || [])
                : [];
            return allPrayers
                .flatMap((prayer) => {
                    const date = new Date(prayer.time);
                    const dayKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                    const prayerKey = prayer.name.toLowerCase();
                    const prepTimeMs = prayer.time - (PRAYER_PREP_LEAD_MINUTES * 60 * 1000);
                    const prepBodyPrimary = formatPromptWithRef(stablePick(PRAYER_PREP_LIBRARY[prayer.name], `${dayKey}-${prayer.name}-prep-primary`));
                    const prepBodySunnah = formatPromptWithRef(stablePick(SUNNAH_PREP_LIBRARY, `${dayKey}-${prayer.name}-prep-sunnah`));
                    const timeBody = formatPromptWithRef(stablePick(PRAYER_TIME_LIBRARY[prayer.name], `${dayKey}-${prayer.name}-time`));

                if (!cancelled) { setPrayerTimesData(data); setPtLoading(false); }
              })
              .catch(() => {
                // Graceful offline fallback — use local calculation
                if (!cancelled) {
                  const fallback = getPrayerTimesForDisplay(userCoords);
                  setPrayerTimesData(fallback);
                  setPtLoading(false);
                }
              });
            return () => { cancelled = true; };
          }, [userCoords && userCoords.lat, userCoords && userCoords.lng]);

          React.useEffect(() => {

            const payload = buildWidgetSnapshot({
              userCoords,
              prayerResult,
              totalSalawatToday,
              streakCount,
              nowMs,
            });
            const identity = JSON.stringify({
              prayerTimes: payload.prayerTimes,
              locationLabel: payload.locationLabel,
              nextPrayerName: payload.nextPrayerName,
              nextPrayerTimeMs: payload.nextPrayerTimeMs,
              totalSalawatToday: payload.totalSalawatToday,
              streakCount: payload.streakCount,
            });
            if (identity === widgetSyncRef.current) return;
            widgetSyncRef.current = identity;
            syncNativeWidgetSnapshot(payload);
          }, [
            userCoords?.lat,
            userCoords?.lng,
            userCoords?.label,
            prayerTimesData ? JSON.stringify(prayerTimesData.prayers) : '',
            totalSalawatToday,
            streakCount,
            nowMs,

          React.useEffect(() => {
            let cancelled = false;
            getPrayerNotificationPermissionStatus().then((status) => {

          }, []);

          React.useEffect(() => {

          React.useEffect(() => {
            if (!prayerNotificationsEnabled || !userCoords || prayerNotificationStatus !== 'granted') return;
            const todayResult = prayerTimesData || getPrayerTimesForDisplay(userCoords);
            if (!todayResult) return;
            const prayerResults = [todayResult];
            for (let offset = 1; offset <= 6; offset += 1) {

            const reminders = buildPrayerNotificationReminders({
              prayerResults,
              locationLabel: userCoords.label,

            if (identity === prayerNotificationSyncRef.current) return;
            prayerNotificationSyncRef.current = identity;
            syncWebPrayerNotifications({
              reminders,

              permission: prayerNotificationStatus,

              console.warn('Could not sync prayer notifications', error);

          }, [
            prayerNotificationsEnabled,
            prayerNotificationStatus,
            userCoords?.lat,
            userCoords?.lng,

          // Launch & Onboarding States

          const [tasbihCustomInput, setTasbihCustomInput] = useState('');

          /** @param {string} message @param {'error'|'success'|'info'} [type] */
          const showToast = (message, type = 'info') => {

          const handleTogglePrayerNotifications = async () => {

            if (isAppleMobileDevice() && !isStandaloneDisplayMode()) {

              return;

              return;

            if (prayerNotificationsEnabled) {

          // ─── Entry Share Card ─────────────────────────────────────────────────
          // Renders a diary entry onto a 1080×1350 canvas (4:5, ideal for stories
          // and WhatsApp) styled to match the app's aesthetic — parchment/navy
          // background, gold border frame, Islamic star watermark, Cormorant body.
          const handleCreateEntryCard = async (entry) => {
            await document.fonts.ready;

            const SCALE = 2; // retina
            const W = 1080, H = 1350;
            const canvas = document.createElement('canvas');
            canvas.width  = W * SCALE;
            canvas.height = H * SCALE;
            const ctx = canvas.getContext('2d');
            ctx.scale(SCALE, SCALE);

            const dark = isDarkMode;
            const BG    = dark ? '#16122E' : '#fdfaf5';
            const TEXT  = dark ? '#dde3ed' : '#130f0a';
            const GOLD  = '#a87b32';
            const GOLD2 = dark ? 'rgba(168,123,50,0.18)' : 'rgba(168,123,50,0.22)';
            const GOLD3 = dark ? 'rgba(168,123,50,0.07)' : 'rgba(168,123,50,0.09)';
            const SUB   = dark ? 'rgba(221,227,237,0.35)' : 'rgba(19,15,10,0.32)';

            // ── Background
            ctx.fillStyle = BG;
            ctx.fillRect(0, 0, W, H);

            // Subtle radial vignette for depth
            const vig = ctx.createRadialGradient(W/2, H/2, 200, W/2, H/2, W * 0.85);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, dark ? 'rgba(0,0,0,0.35)' : 'rgba(0,0,0,0.08)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            // ── Border frame — two nested rectangles
            const PAD = 38;
            ctx.strokeStyle = GOLD;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(PAD, PAD, W - PAD*2, H - PAD*2);
            ctx.strokeStyle = GOLD2;
            ctx.lineWidth = 1;
            ctx.strokeRect(PAD + 10, PAD + 10, W - (PAD+10)*2, H - (PAD+10)*2);

            // ── NMoQ cracked panel tessellation (100×100 viewBox scaled to 560px, centred)
            const SS = 560, SX = (W - SS) / 2, SY = (H - SS) / 2;
            const sc = SS / 100;
            ctx.save();
            ctx.translate(SX, SY);
            ctx.scale(sc, sc);
            ctx.globalAlpha = dark ? 0.055 : 0.065;
            ctx.strokeStyle = GOLD;
            ctx.lineWidth = 1.2 / sc;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke(new Path2D(MOTIF_PATH));
            ctx.restore();

            // ── Header — app name
            const HDR_Y = PAD + 62;
            // Decorative ornament lines
            const lineLen = 52, lineY = HDR_Y - 14;
            ctx.fillStyle = GOLD;
            ctx.fillRect(W/2 - lineLen - 18, lineY, lineLen, 1);
            ctx.fillRect(W/2 + 18, lineY, lineLen, 1);
            // Small diamond centre
            ctx.save();
            ctx.translate(W/2, lineY + 0.5);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = GOLD;
            ctx.fillRect(-4, -4, 8, 8);
            ctx.restore();

            ctx.font = `600 20px Cinzel, Georgia, serif`;
            ctx.fillStyle = GOLD;
            ctx.textAlign = 'center';
            ctx.letterSpacing = '0.18em';
            ctx.fillText('R Ū Ḥ', W / 2, HDR_Y);
            ctx.letterSpacing = '0';

            ctx.fillStyle = GOLD3;
            ctx.fillRect(PAD + 10 + 1, HDR_Y + 18, W - (PAD+10)*2 - 2, 1);

            // ── Opening quote glyph
            ctx.font = `italic 200px "Cormorant Garamond", Georgia, serif`;
            ctx.fillStyle = GOLD2;
            ctx.textAlign = 'left';
            ctx.fillText('\u201C', PAD + 42, H / 2 - 58);

            // ── Entry body text — centred, wrapped, italic
            const wrapText = (text, x, midY, maxW, lh) => {
              const words = text.split(' ');
              const lines = [];
              let cur = '';
              for (const w of words) {
                const test = cur ? `${cur} ${w}` : w;
                if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
                else cur = test;
              }
              if (cur) lines.push(cur);
              const startY = midY - ((lines.length - 1) * lh) / 2;
              lines.forEach((l, i) => ctx.fillText(l, x, startY + i * lh));
              return lines.length;
            };

            const maxW = W - 180;
            const truncated = entry.text.length > 300
              ? entry.text.slice(0, 297) + '\u2026'
              : entry.text;

            // Font size: scale down for longer entries
            const fontSize = truncated.length < 100 ? 46
              : truncated.length < 180 ? 40
              : truncated.length < 260 ? 36
              : 32;
            const lineH = fontSize * 1.6;

            ctx.font = `italic ${fontSize}px "Cormorant Garamond", Georgia, serif`;
            ctx.fillStyle = TEXT;
            ctx.textAlign = 'center';
            wrapText(truncated, W / 2, H / 2 + 28, maxW, lineH);

            // ── Footer divider
            const FTR_TOP = H - 220;
            ctx.fillStyle = GOLD2;
            ctx.fillRect(W/2 - 140, FTR_TOP, 280, 1);

            // Surah / source
            if (entry.surah && entry.surah !== 'General Reflection') {
              ctx.font = `400 16px Cinzel, Georgia, serif`;
              ctx.fillStyle = GOLD;
              ctx.textAlign = 'center';
              ctx.letterSpacing = '0.14em';
              const src = entry.ayah && entry.ayah !== '—'
                ? `${entry.surah}  ·  ${entry.ayah}`
                : entry.surah;
              ctx.fillText(src.toUpperCase(), W / 2, FTR_TOP + 34);
              ctx.letterSpacing = '0';
            }

            // Date
            ctx.font = `300 14px Cinzel, Georgia, serif`;
            ctx.fillStyle = SUB;
            ctx.textAlign = 'center';
            ctx.fillText(entry.date, W / 2, FTR_TOP + (entry.surah !== 'General Reflection' ? 60 : 36));

            // Bottom ornament
            const BOT_Y = H - PAD - 48;
            ctx.fillStyle = GOLD;
            ctx.fillRect(W/2 - lineLen - 18, BOT_Y, lineLen, 1);
            ctx.fillRect(W/2 + 18, BOT_Y, lineLen, 1);
            ctx.save();
            ctx.translate(W/2, BOT_Y + 0.5);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = GOLD;
            ctx.fillRect(-4, -4, 8, 8);
            ctx.restore();

            ctx.font = `300 11px Cinzel, Georgia, serif`;
            ctx.fillStyle = dark ? 'rgba(168,123,50,0.45)' : 'rgba(168,123,50,0.55)';
            ctx.letterSpacing = '0.22em';
            ctx.fillText('A SPACE FOR THE HEART', W / 2, BOT_Y + 24);
            ctx.letterSpacing = '0';

            setShareCard({ dataUrl: canvas.toDataURL('image/png'), entry });
          };

          // ─── Milestone Share Card ──────────────────────────────────────────────
          // Generates a 1080×1080 celebration card for: salawat reaching 100 today
          // or all 7 doa shields being raised. Matches the app's visual language.
          const handleCreateMilestoneCard = async (type) => {
            await document.fonts.ready;

            const SCALE = 2;
            const W = 1080, H = 1080;
            const canvas = document.createElement('canvas');
            canvas.width  = W * SCALE;
            canvas.height = H * SCALE;
            const ctx = canvas.getContext('2d');
            ctx.scale(SCALE, SCALE);

            const dark  = isDarkMode;

            // Colour tokens — gold for salawat, emerald for shields
            const ACCENT  = isSalawat ? '#a87b32' : '#3ca36e';
            const ACCENT2 = isSalawat
              ? (dark ? 'rgba(168,123,50,0.18)' : 'rgba(168,123,50,0.22)')
              : (dark ? 'rgba(60,163,110,0.18)'  : 'rgba(60,163,110,0.22)');
            const ACCENT3 = isSalawat
              ? (dark ? 'rgba(168,123,50,0.07)' : 'rgba(168,123,50,0.09)')
              : (dark ? 'rgba(60,163,110,0.06)'  : 'rgba(60,163,110,0.08)');
            const BG   = dark ? '#16122E' : (isSalawat ? '#fdfaf5' : '#f2faf6');
            const TEXT = dark ? '#dde3ed' : '#130f0a';
            const SUB  = dark ? 'rgba(221,227,237,0.38)' : 'rgba(19,15,10,0.35)';

            // ── Background
            ctx.fillStyle = BG;
            ctx.fillRect(0, 0, W, H);

            // Subtle radial vignette
            const vig = ctx.createRadialGradient(W/2, H/2, 180, W/2, H/2, W * 0.82);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, dark ? 'rgba(0,0,0,0.38)' : 'rgba(0,0,0,0.07)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            // ── Double border frame
            const PAD = 38;
            ctx.strokeStyle = ACCENT;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(PAD, PAD, W - PAD*2, H - PAD*2);
            ctx.strokeStyle = ACCENT2;
            ctx.lineWidth = 1;
            ctx.strokeRect(PAD + 10, PAD + 10, W - (PAD+10)*2, H - (PAD+10)*2);

            // ── NMoQ cracked panel tessellation (100×100 viewBox scaled to 700px, centred)
            const SS = 700, SX = (W - SS) / 2, SY = (H - SS) / 2;
            const sc = SS / 100;
            ctx.save();
            ctx.translate(SX, SY);
            ctx.scale(sc, sc);
            ctx.globalAlpha = dark ? 0.045 : 0.055;
            ctx.strokeStyle = ACCENT;
            ctx.lineWidth = 1.2 / sc;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke(new Path2D(MOTIF_PATH));
            ctx.restore();

            // ── Header — app name with ornament lines
            const HDR_Y = PAD + 62;
            const lineLen = 52, lineY = HDR_Y - 14;
            ctx.fillStyle = ACCENT;
            ctx.fillRect(W/2 - lineLen - 18, lineY, lineLen, 1);

            ctx.translate(W/2, lineY + 0.5);

            ctx.fillStyle = ACCENT;
            ctx.fillRect(-4, -4, 8, 8);
            ctx.restore();
            ctx.font = `600 20px Cinzel, Georgia, serif`;
            ctx.fillStyle = ACCENT;
            ctx.textAlign = 'center';
            ctx.letterSpacing = '0.18em';
            ctx.fillText('R Ū Ḥ', W / 2, HDR_Y);
            ctx.letterSpacing = '0';
            ctx.fillStyle = ACCENT3;
            ctx.fillRect(PAD + 10 + 1, HDR_Y + 18, W - (PAD+10)*2 - 2, 1);

            const CY = H / 2;

            if (isSalawat) {

              glowR.addColorStop(0, isSalawat
                ? (dark ? 'rgba(168,123,50,0.14)' : 'rgba(168,123,50,0.10)')

              glowR.addColorStop(1, 'rgba(0,0,0,0)');
              ctx.fillStyle = glowR;
              ctx.fillRect(W/2 - 160, CY - 168, 320, 320);

              // Large "100"
              ctx.font = `700 210px Cinzel, Georgia, serif`;
              ctx.fillStyle = ACCENT;
              ctx.textAlign = 'center';

              ctx.font = `italic 42px "Cormorant Garamond", Georgia, serif`;
              ctx.fillStyle = dark ? 'rgba(221,227,237,0.55)' : 'rgba(19,15,10,0.50)';

              ctx.translate(-24, -28);

              // Shield fill
              const shieldPath = new Path2D('M 24 3 L 45 12 L 45 34 C 45 44 36 52 24 55 C 12 52 3 44 3 34 L 3 12 Z');
              ctx.fillStyle = dark ? 'rgba(60,163,110,0.12)' : 'rgba(60,163,110,0.10)';
              ctx.fill(shieldPath);
              ctx.strokeStyle = 'rgba(60,163,110,0.75)';

              ctx.fillStyle = dark ? 'rgba(221,227,237,0.55)' : 'rgba(19,15,10,0.50)';

            ctx.fillStyle = ACCENT2;
            ctx.fillRect(W/2 - 140, FTR_TOP, 280, 1);

              ctx.fillText(userName, W/2, FTR_TOP + 64);

            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = ACCENT;
            ctx.fillRect(-4, -4, 8, 8);
            ctx.restore();
            ctx.font = `300 11px Cinzel, Georgia, serif`;
            ctx.fillStyle = dark ? 'rgba(168,123,50,0.45)' : 'rgba(168,123,50,0.55)';
            ctx.letterSpacing = '0.22em';
            ctx.fillText('A SPACE FOR THE HEART', W/2, BOT_Y + 24);
            ctx.letterSpacing = '0';

            setMilestoneCard({ dataUrl: canvas.toDataURL('image/png'), type });

          // Listen for storage quota errors from useLocalStorage
          useEffect(() => {
            const handler = () => showToast(
              'Storage is full — this entry could not be saved. Please export and delete some older reflections to free space.',
              'error'
