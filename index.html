                            <button
                              onClick={handleAddNewDiaryEntry}
                              disabled={newEntryText.trim() === ''}
                              className="px-5 py-1.5 bg-gold text-white font-editorial text-sm rounded-lg disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gold-dark transition-colors shadow-sm"
                            >Save</button>
                          </div>
                        </div>
                      )}

                      <div className="space-y-4">
                        {/* Search */}
                        <div className="relative mb-5">
                          <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i className="ph ph-magnifying-glass text-[14px] text-ink/30 dark:text-slate-500"></i>
                          </div>
                          <input
                            type="text"
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            placeholder="Search reflections..."
                            maxLength={200}
                            className="w-full bg-white dark:bg-slate-800/50 rounded-xl py-3 pl-9 pr-4 border border-ink/8 dark:border-slate-700/50 font-editorial text-sm text-ink dark:text-slate-200 placeholder-ink/25 dark:placeholder-slate-600 focus:outline-none focus:border-gold/50 dark:focus:border-gold/30 transition-all"
                          />
                          {searchQuery && (
                            <button
                              onClick={() => setSearchQuery('')}
                              className="absolute inset-y-0 right-0 pr-3 flex items-center text-ink/30 hover:text-ink/60 dark:text-slate-600 dark:hover:text-slate-400"
                            ><i className="ph ph-x text-[13px]"></i></button>
                          )}
                        </div>

                        {/* On This Day */}
                        {onThisDayEntries.length > 0 && !searchQuery && (
                          <div className="mb-6">
                            <div className="flex items-center gap-2 mb-3">
                              <div className="memory-shimmer h-px flex-1 rounded-full"></div>
                              <span className="font-display text-[9px] tracking-[0.25em] uppercase flex items-center gap-1.5"
                                style={{color: isDarkMode ? 'rgba(168,123,50,0.65)' : 'rgba(168,123,50,0.75)'}}>
                                <i className="ph-fill ph-clock-clockwise text-[10px]"></i>
                                On This Day
                              </span>
                              <div className="memory-shimmer h-px flex-1 rounded-full"></div>
                            </div>
                            {onThisDayEntries.map(entry => (
                              <div key={`otd-${entry.id}`}
                                className="relative mb-3 px-5 pt-4 pb-4 rounded-xl border overflow-hidden"
                                style={{
                                  background: isDarkMode ? 'rgba(168,123,50,0.06)' : 'rgba(168,123,50,0.07)',
                                  borderColor: isDarkMode ? 'rgba(168,123,50,0.2)' : 'rgba(168,123,50,0.22)'
                                }}>
                                <div className="absolute top-0 left-0 w-full h-0.5" style={{
                                  background: 'linear-gradient(90deg, transparent, rgba(168,123,50,0.5), transparent)'
                                }}></div>
                                <div className="flex justify-between items-center mb-2">
                                  <span className="font-display text-[9px] tracking-[0.12em] uppercase"
                                    style={{color: isDarkMode ? 'rgba(168,123,50,0.6)' : 'rgba(168,123,50,0.7)'}}>
                                    {entry.surah}{entry.ayah !== "—" && ` · ${entry.ayah}`}
                                  </span>
                                  <span className="font-display text-[9px] tracking-widest uppercase"
                                    style={{color: isDarkMode ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.22)'}}>
                                    {entry.date}
                                  </span>
                                </div>
                                <p className="font-editorial text-base italic leading-relaxed"
                                  style={{color: isDarkMode ? 'rgba(221,227,237,0.65)' : 'rgba(19,15,10,0.62)'}}>
                                  "{entry.text}"
                                </p>
                              </div>
                            ))}
                          </div>
                        )}

                        {/* Entries */}
                        {filteredDiaryEntries.length > 0 ? (
                          filteredDiaryEntries.map((entry) => (
                            <div key={entry.id} className="verse-card-bookmark bg-white dark:bg-slate-800/30 px-5 pt-4 pb-4 rounded-xl border border-ink/[0.12] dark:border-slate-700/40 hover:border-gold/40 dark:hover:border-gold/20 transition-colors group shadow-sm">
                              <div className="flex justify-between items-center mb-2">
                                <span className="font-display text-[9px] text-gold/70 dark:text-gold/50 uppercase tracking-[0.15em] flex items-center">
                                  {entry.surah !== "General Reflection" && <i className="ph-fill ph-book-open text-[9px] mr-1"></i>}
                                  {entry.surah}{entry.ayah !== "—" && ` · ${entry.ayah}`}
                                </span>
                                <div className="flex items-center gap-2.5">
                                  <span className="font-display text-[9px] text-ink/25 dark:text-slate-600 uppercase tracking-widest">
                                    {entry.date}
                                  </span>
                                  {editingEntryId !== entry.id && (
                                    <>
                                      <button
                                        onClick={() => handleCreateEntryCard(entry)}
                                        className="text-ink/20 dark:text-slate-700 hover:text-gold dark:hover:text-gold-light transition-colors"
                                        title="Create share card"
                                      ><i className="ph ph-image text-[13px]"></i></button>
                                      <button
                                        onClick={() => { setEditingEntryId(entry.id); setEditingText(entry.text); }}
                                        className="text-ink/20 dark:text-slate-700 hover:text-gold dark:hover:text-gold-light transition-colors"
                                        title="Edit reflection"
                                      ><i className="ph ph-pencil-simple text-[13px]"></i></button>
                                      <button
                                        onClick={() => setDiaryEntries(diaryEntries.filter(e => e.id !== entry.id))}
                                        className="text-ink/20 dark:text-slate-700 hover:text-red-400 dark:hover:text-red-400 transition-colors"
                                        title="Delete reflection"
                                      ><i className="ph ph-trash text-[13px]"></i></button>
                                    </>
                                  )}
                                </div>
                              </div>
                              {editingEntryId === entry.id ? (
                                <div>
                                  <textarea
                                    value={editingText}
                                    onChange={(e) => setEditingText(e.target.value)}
                                    className="diary-textarea w-full bg-parchment/60 dark:bg-slate-800/60 rounded-xl border border-gold/30 dark:border-gold/20 p-3 text-ink dark:text-slate-200 font-editorial text-base leading-7 resize-none focus:outline-none focus:border-gold/60 transition-all"
                                    rows={4}
                                    maxLength={5000}
                                    autoFocus
                                  />
                                  <div className="flex justify-end gap-2 mt-2">
                                    <button
                                      onClick={() => setEditingEntryId(null)}
                                      className="px-3 py-1.5 rounded-lg font-editorial text-sm text-ink/40 dark:text-slate-500 hover:text-ink/70 transition-colors"
                                    >Cancel</button>
                                    <button
                                      onClick={() => {
                                        if (editingText.trim()) {
                                          setDiaryEntries(diaryEntries.map(e => e.id === entry.id ? {...e, text: editingText.trim()} : e));
                                          window.RuhSoundscape.onSave();
                                          setEditingEntryId(null);
                                        }
                                      }}
                                      className="px-3 py-1.5 rounded-lg font-editorial text-sm bg-gold text-white hover:bg-gold-dark shadow-sm transition-colors"
                                    >Save</button>
                                  </div>
                                </div>
                              ) : (
                                <p className="font-editorial text-base text-ink/70 dark:text-slate-300 leading-relaxed italic group-hover:text-ink dark:group-hover:text-slate-200 transition-colors whitespace-pre-wrap">
                                  "{entry.text}"
                                </p>
                              )}
                            </div>
                          ))
                        ) : (
                          <div className="py-14 text-center flex flex-col items-center border border-dashed border-gold/15 dark:border-slate-700/40 rounded-2xl bg-white/40 dark:bg-transparent">
                            <RuhLogoMark className="w-12 h-12 mb-3 text-gold/55 dark:text-gold-light/45 opacity-95" />
                            <p className="font-editorial text-base italic text-ink/35 dark:text-slate-600">
                              {searchQuery ? 'No reflections match your search.' : (userName ? `Begin your story, ${userName}.` : 'Begin your story.')}
                            </p>
                            <p className="font-editorial text-sm text-ink/25 dark:text-slate-700 mt-1">
                              {searchQuery ? 'Try different words.' : 'Tap + to write your first entry.'}
                            </p>
                          </div>
                        )}

                        {filteredDiaryEntries.length > 0 && (
                          <div className="py-6 text-center flex flex-col items-center">
                            <IslamicMotif className="w-4 h-4 text-ink/12 dark:text-slate-700 mb-1.5" />
                            <p className="font-display text-[9px] text-ink/20 dark:text-slate-700 uppercase tracking-[0.2em]">End of reflections</p>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </main>

                {/* ── Share Card Modal ─────────────────────────────────────────── */}
                {shareCard && (
                  <div
                    className="fixed inset-0 z-[300] flex flex-col items-center justify-center bg-ink/80 dark:bg-slate-950/90 backdrop-blur-md animate-in fade-in duration-300"
                    onClick={() => setShareCard(null)}
                  >
                    {/* Card preview — stop click bubbling so tapping card doesn't close */}
                    <div
                      className="relative w-[88vw] max-w-[360px] animate-in zoom-in-90 fade-in duration-300"
                      onClick={e => e.stopPropagation()}
                    >
                      {/* The rendered card image */}
                      <img
                        src={shareCard.dataUrl}
                        alt="Your reflection card"
                        className="w-full rounded-2xl shadow-2xl shadow-black/50"
                        style={{ aspectRatio: '1080/1350' }}
                      />

                      {/* Action bar below the card */}
                      <div className="mt-4 flex items-center justify-center gap-3">
                        {/* Download — saves PNG to device (works everywhere) */}
                        <a
                          href={shareCard.dataUrl}
                          download={`ruh-reflection-${shareCard.entry.date.replace(/\s/g,'-')}.png`}
                          className="flex items-center gap-2 px-5 py-2.5 bg-gold hover:bg-gold-dark text-white font-editorial text-sm rounded-xl transition-colors shadow-lg shadow-gold/30 active:scale-95"
                          title="Save image"
                        >
                          <i className="ph ph-download-simple text-[16px]"></i>
                          Save image
                        </a>

                        {/* Share — native share sheet on iOS/Android, download on desktop */}
                        {typeof navigator !== 'undefined' && navigator.share && (
                          <button
                            onClick={async () => {
                              try {
                                const res  = await fetch(shareCard.dataUrl);
                                const blob = await res.blob();
                                const file = new File([blob], 'ruh-reflection.png', { type: 'image/png' });
                                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                  await navigator.share({ files: [file], title: 'My Rūḥ Reflection' });
                                } else {
                                  await navigator.share({ title: 'My Rūḥ Reflection', text: shareCard.entry.text });
                                }
                              } catch (err) {
                                if (err.name !== 'AbortError') showToast('Could not open share sheet.', 'error');
                              }
                            }}
                            className="flex items-center gap-2 px-5 py-2.5 bg-white/10 hover:bg-white/20 text-white font-editorial text-sm rounded-xl transition-colors border border-white/20 active:scale-95"
                          >
                            <i className="ph ph-share-network text-[16px]"></i>
                            Share
                          </button>
                        )}
                      </div>

                      {/* Dismiss hint */}
                      <p className="text-center font-editorial text-xs italic text-white/35 mt-3">
                        Tap outside to close
                      </p>
                    </div>

                    {/* Close button top-right */}
                    <button
                      onClick={() => setShareCard(null)}
                      className="absolute top-5 right-5 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors border border-white/15"
                    >
                      <i className="ph ph-x text-[17px]"></i>
                    </button>
                  </div>
                )}

                {/* ── Tasbih Full-Screen Focus Mode ────────────────────────────── */}
                {tasbihMode && (() => {
                  const TARGETS = [33, 99, 100, 0]; // 0 = ∞
                  const target = tasbihTarget;
                  const count  = tasbihSessionCount;
                  const cycle  = target > 0 ? Math.floor(count / target) : 0;
                  const cycleComplete = target > 0 && count > 0 && count % target === 0;
                  // In-cycle display: when complete show full target, otherwise current position
                  const displayCount = target > 0 ? (cycleComplete ? target : count % target) : count;
                  const progress = target > 0 ? displayCount / target : 0;
                  const R = 108, CIRC = 2 * Math.PI * R;
                  const accentColor = cycleComplete ? '#3ca36e' : 'rgba(201,168,76,0.88)';

                  const handleTasbihTap = () => {
                    handleReciteSalawat(tasbihMode.id);
                    setTasbihSessionCount(prev => {
                      const next = prev + 1;
                      if (target > 0 && next % target === 0) {
                        haptic([15, 60, 15]);
                        setTimeout(() => window.RuhSoundscape.onMilestone(), 120);
                        setTasbihCycleKey(k => k + 1);
                      }
                      return next;
                    });
                    setTasbihRippleKey(k => k + 1);
                    setTasbihCountKey(k => k + 1);
                  };

                  const undoTap = (e) => {
                    e.stopPropagation();
                    if (count > 0) {
                      setTasbihSessionCount(prev => prev - 1);
                      setTotalSalawatToday(prev => Math.max(0, prev - 1));
                      setSalawatCounts(prev => ({...prev, [tasbihMode.id]: Math.max(0, (prev[tasbihMode.id] || 0) - 1)}));
                      setTasbihCountKey(k => k + 1);
                    }
                  };

                  const cycleLabel = cycleComplete
                    ? `✦  Cycle ${cycle} Complete  ✦`
                    : cycle > 0 ? `Cycle ${cycle + 1}`
                    : target > 0 ? `/ ${target}` : '∞';

                  return (
                    <div className="fixed inset-0 z-[400] flex flex-col select-none overflow-hidden" style={{background:'#11102A'}}>
                      {/* Ambient centre glow — shifts colour on cycle complete */}
                      <div className="absolute inset-0 pointer-events-none" style={{
                        background: `radial-gradient(ellipse 65% 55% at 50% 52%, ${cycleComplete ? 'rgba(60,163,110,0.11)' : 'rgba(168,123,50,0.07)'} 0%, transparent 70%)`,
                        transition: 'background 0.6s ease',
                      }} />
                      {/* Islamic star watermark */}
                      <IslamicMotif className="absolute inset-0 m-auto w-[420px] h-[420px] text-gold opacity-[0.04] pointer-events-none" />

                      {/* ── Header ── */}
                      <div className="relative z-10 flex items-center justify-between px-5 pt-10 pb-3 shrink-0">
                        <button
                          onClick={() => setTasbihMode(null)}
                          className="w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition-transform"
                          style={{background:'rgba(255,255,255,0.07)', border:'1px solid rgba(255,255,255,0.10)'}}
                        >
                          <i className="ph ph-x text-[16px]" style={{color:'rgba(255,255,255,0.55)'}}></i>
                        </button>
                        <div className="text-center flex-1 px-3">
                          <p className="font-display text-[8px] uppercase tracking-[0.26em]" style={{color:'rgba(168,123,50,0.42)'}}>Focus Mode</p>
                          <p className="font-editorial text-sm mt-0.5 truncate" style={{color:'rgba(255,255,255,0.55)'}}>{tasbihMode.name}</p>
                        </div>
                        <div className="w-10" />
                      </div>

                      {/* ── Main tap area ── */}
                      <div
                        className="flex-1 relative flex flex-col items-center justify-center z-10"
                        onClick={handleTasbihTap}
                        role="button"
                        aria-label="Tap to recite"
                      >
                        {/* Expanding ripple on each tap */}
                        <div
                          key={tasbihRippleKey}
                          className="tasbih-ripple-ring pointer-events-none"
                          style={{
                            position:'absolute', left:'50%', top:'50%',
                            width:240, height:240, borderRadius:'50%',
                            border:`1.5px solid ${cycleComplete ? 'rgba(60,163,110,0.45)' : 'rgba(168,123,50,0.35)'}`,
                          }}
                        />

                        {/* SVG progress ring */}
                        <svg width="240" height="240" viewBox="0 0 240 240" className="absolute" style={{pointerEvents:'none'}}>
                          {/* Track */}
                          <circle cx="120" cy="120" r={R} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="3"/>
                          {/* Progress arc */}
                          {target > 0 ? (
                            <circle
                              cx="120" cy="120" r={R}
                              fill="none"
                              stroke={accentColor}
                              strokeWidth="3"
                              strokeLinecap="round"
                              strokeDasharray={CIRC}
                              strokeDashoffset={CIRC * (1 - progress)}
                              transform="rotate(-90 120 120)"
                              style={{transition:'stroke-dashoffset 0.25s ease, stroke 0.4s ease'}}
                            />
                          ) : (
                            /* ∞ mode — dashed decorative ring */
                            <circle cx="120" cy="120" r={R} fill="none" stroke="rgba(201,168,76,0.15)" strokeWidth="2.5" strokeDasharray="6 11"/>
                          )}
                        </svg>

                        {/* Count + labels inside ring */}
                        <div
                          className="relative flex flex-col items-center justify-center"
                          style={{width:240, height:240, pointerEvents:'none'}}
                        >
                          {/* Cycle / target label above number */}
                          {cycleComplete ? (
                            <span key={tasbihCycleKey} className="tasbih-cycle-label font-display text-[9px] uppercase tracking-[0.18em] mb-2"
                              style={{color:'rgba(60,163,110,0.80)'}}>
                              {`✦  Cycle ${cycle} Complete  ✦`}
                            </span>
                          ) : (
                            <span className="font-display text-[9px] uppercase tracking-[0.20em] mb-2"
                              style={{color:'rgba(255,255,255,0.28)'}}>
                              {cycleLabel}
                            </span>
                          )}

                          {/* Big counter number */}
                          <span
                            key={tasbihCountKey}
                            className="tasbih-pop font-display font-bold tabular-nums"
                            style={{
                              fontSize: displayCount >= 1000 ? 78 : displayCount >= 100 ? 94 : 112,
                              lineHeight: 1,
                              color: cycleComplete ? '#3ca36e' : 'white',
                              transition: 'color 0.35s ease',
                            }}
                          >
                            {displayCount}
                          </span>

                          {/* Sub-label below number */}
                          {count === 0 ? (
                            <span className="font-editorial text-sm italic mt-3" style={{color:'rgba(255,255,255,0.22)'}}>Tap to begin</span>
                          ) : !cycleComplete && cycle > 0 ? (
                            <span className="font-display text-[9px] uppercase tracking-widest mt-2" style={{color:'rgba(255,255,255,0.20)'}}>
                              {count} recited
                            </span>
                          ) : null}
                        </div>
                      </div>

                      {/* ── Footer controls ── */}
                      <div className="relative z-10 shrink-0 flex items-center justify-between px-8 pb-12 pt-4">
                        {/* Undo last tap */}
                        <button
                          onClick={undoTap}
                          disabled={count === 0}
                          className="w-12 h-12 rounded-2xl flex items-center justify-center active:scale-90 transition-transform disabled:opacity-20"
                          style={{background:'rgba(255,255,255,0.07)', border:'1px solid rgba(255,255,255,0.10)'}}
                          title="Undo"
                        >
                          <i className="ph ph-arrow-counter-clockwise text-[19px]" style={{color:'rgba(255,255,255,0.55)'}}></i>
                        </button>

                        {/* Target — tap to open picker */}
                        <button
                          onClick={e => { e.stopPropagation(); setTasbihCustomInput(''); setTasbihShowPicker(true); }}
                          className="flex flex-col items-center gap-0.5 px-6 py-3 rounded-2xl active:scale-95 transition-transform"
                          style={{background:'rgba(255,255,255,0.07)', border:'1px solid rgba(255,255,255,0.10)'}}
                        >
                          <span className="font-display text-[8px] uppercase tracking-widest" style={{color:'rgba(168,123,50,0.50)'}}>Target</span>
                          <span className="font-display text-xl font-bold" style={{color:'rgba(168,123,50,0.92)'}}>
                            {tasbihTarget === 0 ? '∞' : tasbihTarget}
                          </span>
                        </button>

                        {/* Target picker sheet */}
                        {tasbihShowPicker && (
                          <div
                            className="absolute inset-0 flex items-end z-10"
                            style={{background:'rgba(0,0,0,0.55)', backdropFilter:'blur(4px)'}}
                            onClick={e => { e.stopPropagation(); setTasbihShowPicker(false); }}
                          >
                            <div
                              className="w-full rounded-t-3xl px-6 pt-6 pb-8 animate-in slide-in-from-bottom-4 duration-300"
                              style={{background:'#1c1a38', border:'1px solid rgba(255,255,255,0.10)', borderBottom:'none'}}
                              onClick={e => e.stopPropagation()}
                            >
                              <p className="font-display text-[9px] uppercase tracking-[0.22em] text-center mb-5" style={{color:'rgba(168,123,50,0.55)'}}>Set Target</p>

                              {/* Preset chips */}
                              <div className="flex flex-wrap justify-center gap-2 mb-5">
                                {[33, 66, 99, 100, 200, 500, 1000, 0].map(n => (
                                  <button
                                    key={n}
                                    onClick={() => { setTasbihTarget(n); setTasbihShowPicker(false); }}
                                    className="px-4 py-2 rounded-xl font-display text-sm font-bold transition-all active:scale-95"
                                    style={{
                                      background: tasbihTarget === n ? 'rgba(168,123,50,0.25)' : 'rgba(255,255,255,0.07)',
                                      border: tasbihTarget === n ? '1px solid rgba(168,123,50,0.50)' : '1px solid rgba(255,255,255,0.10)',
                                      color: tasbihTarget === n ? 'rgba(168,123,50,0.95)' : 'rgba(255,255,255,0.55)',
                                    }}
                                  >
                                    {n === 0 ? '∞' : n}
                                  </button>
                                ))}
                              </div>

                              {/* Custom number input */}
                              <div className="flex gap-2">
                                <input
                                  type="number"
                                  inputMode="numeric"
                                  min="1"
                                  max="9999"
                                  placeholder="Custom…"
                                  value={tasbihCustomInput}
                                  onChange={e => setTasbihCustomInput(e.target.value)}
                                  onKeyDown={e => {
                                    if (e.key === 'Enter') {
                                      const n = parseInt(tasbihCustomInput, 10);
                                      if (n > 0) { setTasbihTarget(n); setTasbihShowPicker(false); }
                                    }
                                  }}
                                  className="flex-1 rounded-xl px-4 py-3 font-display text-sm text-center outline-none"
                                  style={{background:'rgba(255,255,255,0.07)', border:'1px solid rgba(255,255,255,0.12)', color:'white'}}
                                />
                                <button
                                  onClick={() => {
                                    const n = parseInt(tasbihCustomInput, 10);
                                    if (n > 0) { setTasbihTarget(n); setTasbihShowPicker(false); }
                                  }}
                                  disabled={!tasbihCustomInput || parseInt(tasbihCustomInput,10) <= 0}
                                  className="px-5 py-3 rounded-xl font-display text-[10px] uppercase tracking-widest transition-all active:scale-95 disabled:opacity-30"
                                  style={{background:'rgba(168,123,50,0.20)', border:'1px solid rgba(168,123,50,0.35)', color:'rgba(168,123,50,0.90)'}}
                                >
                                  Set
                                </button>
                              </div>
                            </div>
                          </div>
                        )}

                        {/* Reset this session */}
                        <button
                          onClick={e => { e.stopPropagation(); setTasbihSessionCount(0); setTasbihCountKey(k => k + 1); }}
                          disabled={count === 0}
                          className="w-12 h-12 rounded-2xl flex items-center justify-center active:scale-90 transition-transform disabled:opacity-20"
                          style={{background:'rgba(255,255,255,0.07)', border:'1px solid rgba(255,255,255,0.10)'}}
                          title="Reset session"
                        >
                          <i className="ph ph-broom text-[19px]" style={{color:'rgba(255,255,255,0.55)'}}></i>
                        </button>
                      </div>
                    </div>
                  );
                })()}

                {/* ── Milestone Card Modal ──────────────────────────────────────── */}
                {milestoneCard && (
                  <div
                    className="fixed inset-0 z-[300] flex flex-col items-center justify-center bg-ink/85 dark:bg-slate-950/92 backdrop-blur-md animate-in fade-in duration-400"
                    onClick={() => setMilestoneCard(null)}
                  >
                    <div
                      className="relative w-[88vw] max-w-[360px] animate-in zoom-in-90 fade-in duration-400"
                      onClick={e => e.stopPropagation()}
                    >
                      {/* Radiant glow behind card */}
                      <div className="absolute inset-0 rounded-2xl blur-2xl opacity-30 pointer-events-none"
                        style={{background: milestoneCard.type === 'salawat_100'
                          ? 'radial-gradient(circle, rgba(168,123,50,0.6) 0%, transparent 70%)'
                          : 'radial-gradient(circle, rgba(60,163,110,0.6) 0%, transparent 70%)'}} />
                      <img
                        src={milestoneCard.dataUrl}
                        alt="Milestone achievement"
                        className="w-full rounded-2xl shadow-2xl shadow-black/60 relative"
                        style={{ aspectRatio: '1/1' }}
                      />
                      {/* Action bar */}
                      <div className="mt-4 flex items-center justify-center gap-3">
                        <a
                          href={milestoneCard.dataUrl}
                          download={milestoneCard.type === 'salawat_100'
                            ? `ruh-salawat-100-${new Date().toISOString().slice(0,10)}.png`
                            : `ruh-shields-complete-${new Date().toISOString().slice(0,10)}.png`}
                          className="flex items-center gap-2 px-5 py-2.5 text-white font-editorial text-sm rounded-xl transition-all shadow-lg active:scale-95"
                          style={{background: milestoneCard.type === 'salawat_100' ? '#a87b32' : '#3ca36e',
                            boxShadow: milestoneCard.type === 'salawat_100'
                              ? '0 4px 16px rgba(168,123,50,0.35)'
                              : '0 4px 16px rgba(60,163,110,0.35)'}}
                          title="Save image"
                        >
                          <i className="ph ph-download-simple text-[16px]"></i>
                          Save image
                        </a>
                        {typeof navigator !== 'undefined' && navigator.share && (
                          <button
                            onClick={async () => {
                              try {
                                const res  = await fetch(milestoneCard.dataUrl);
                                const blob = await res.blob();
                                const fname = milestoneCard.type === 'salawat_100'
                                  ? 'ruh-salawat-100.png' : 'ruh-shields-complete.png';
                                const file = new File([blob], fname, { type: 'image/png' });
                                const shareTitle = milestoneCard.type === 'salawat_100'
                                  ? '100 Salawat Today — Alhamdulillah'
                                  : 'All Shields Raised — Alhamdulillah';
                                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                  await navigator.share({ files: [file], title: shareTitle });
                                } else {
                                  await navigator.share({ title: shareTitle });
                                }
                              } catch (err) {
                                if (err.name !== 'AbortError') showToast('Could not open share sheet.', 'error');
                              }
                            }}
                            className="flex items-center gap-2 px-5 py-2.5 bg-white/10 hover:bg-white/20 text-white font-editorial text-sm rounded-xl transition-colors border border-white/20 active:scale-95"
                          >
                            <i className="ph ph-share-network text-[16px]"></i>
                            Share

                        )}
                      </div>
                      <p className="text-center font-editorial text-xs italic text-white/35 mt-3">

                    </div>
                    <button
                      onClick={() => setMilestoneCard(null)}
                      className="absolute top-5 right-5 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors border border-white/15"
                    >

                )}

                {/* ── Toast Notification ───────────────────────────────────────── */}
                {/* Replaces native alert() — used for quota errors, import results */}
                {toast && (
                  <div
                    role="alert"
                    aria-live="assertive"
                    className={`fixed bottom-28 left-1/2 -translate-x-1/2 z-[200] w-[88%] max-w-sm px-5 py-3.5 rounded-2xl shadow-xl flex items-start gap-3 animate-in fade-in slide-in-from-bottom-4 duration-300
                      ${toast.type === 'error'   ? 'bg-red-50 dark:bg-red-950/80 border border-red-200 dark:border-red-800/60' :
                        toast.type === 'success' ? 'bg-emerald-50 dark:bg-emerald-950/80 border border-emerald-200 dark:border-emerald-800/60' :
                                                   'bg-white dark:bg-slate-800 border border-ink/8 dark:border-slate-700'}`}
                  >
                    <i className={`text-[18px] mt-0.5 flex-shrink-0
                      ${toast.type === 'error'   ? 'ph ph-warning text-red-500 dark:text-red-400' :
                        toast.type === 'success' ? 'ph ph-check-circle text-emerald-600 dark:text-emerald-400' :
                                                   'ph ph-info text-gold dark:text-gold-light'}`}
                    ></i>
                    <p className={`font-editorial text-sm leading-snug flex-1
                      ${toast.type === 'error'   ? 'text-red-700 dark:text-red-300' :
                        toast.type === 'success' ? 'text-emerald-700 dark:text-emerald-300' :
                                                   'text-ink/80 dark:text-slate-200'}`}>
                      {toast.message}
                    </p>
                    <button onClick={() => setToast(null)} className="text-ink/20 dark:text-slate-600 hover:text-ink/50 transition-colors flex-shrink-0 mt-0.5">
                      <i className="ph ph-x text-[14px]"></i>

                {/* ── Milestone Celebration Overlay ─────── */}
                {showCelebration && (
                  <div key={celebrationMilestone} className="fixed inset-0 z-50 pointer-events-none flex items-center justify-center">
                    {/* Gold particles */}
                    {CELEBRATION_PARTICLES.map((p, i) => (
                      <div
                        key={i}
                        className="particle-rise absolute rounded-full"
                        style={{
                          left: p.left, top: p.top,
                          width: p.size, height: p.size,
                          backgroundColor: p.color,
                          '--dur': p.dur, '--delay': p.delay,
                        }}
                      />
                    ))}
                    {/* Central card */}
                    <div className="milestone-pop bg-ink/95 dark:bg-slate-900/95 backdrop-blur-sm rounded-3xl px-10 py-8 text-center shadow-2xl shadow-black/40 border border-white/10">
                      <p className="font-display text-[10px] text-white/50 uppercase tracking-[0.25em] mb-2">Masha'Allah{userName ? `, ${userName}` : ''}</p>
                      <p className="font-display text-7xl font-bold text-gold leading-none mb-1" style={{lineHeight:1}}>{celebrationMilestone}</p>
                      <p className="font-editorial text-base italic text-white/70 mt-3">Salawat sent today</p>
                      <p className="font-display text-[9px] text-white/35 uppercase tracking-widest mt-2">Keep going ·  ﷺ</p>
                    </div>
                  </div>
                )}

                {/* Scroll nav buttons — salawat, journey, protection screens */}
                {(currentScreen === 'salawat' || currentScreen === 'journey' || currentScreen === 'protection') && (
                  <div className="fixed bottom-24 right-4 z-40 flex flex-col gap-2">
                    {showScrollTop && (
                      <button
                        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                        className={`w-10 h-10 rounded-full text-white shadow-lg flex items-center justify-center transition-all hover:scale-105 animate-in fade-in zoom-in-75 duration-200
                          bg-gold dark:bg-gold shadow-amber-900/30`}
                        aria-label="Back to top"
                      >
                        <i className="ph-bold ph-arrow-up text-[16px]"></i>
                      </button>
                    )}
                    {showScrollBottom && (
                      <button
                        onClick={() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })}
                        className={`w-10 h-10 rounded-full text-white shadow-lg flex items-center justify-center transition-all hover:scale-105 animate-in fade-in zoom-in-75 duration-200
                          bg-gold dark:bg-gold shadow-amber-900/30`}
                        aria-label="Scroll to bottom"
                      >
                        <i className="ph-bold ph-arrow-down text-[16px]"></i>
                      </button>
                    )}
                  </div>
                )}

                {/* Bottom Tab Bar */}
                <nav className="absolute bottom-0 w-full bg-parchment/97 dark:bg-slate-900/97 backdrop-blur-lg border-t border-amber-900/[0.14] dark:border-slate-800/80 px-2 pt-3 pb-7 flex justify-around items-center z-30 transition-colors duration-500">
                  {/* Read */}
                  <button
                    onClick={() => navigateTo('home')}
                    className={`relative flex flex-col items-center gap-1 w-[20%] transition-all duration-200 ${currentScreen === 'home' || currentScreen === 'verse' ? 'text-gold dark:text-gold-light' : 'text-ink/30 dark:text-slate-600 hover:text-gold/70 dark:hover:text-slate-400'}`}
                  >
                    {(currentScreen === 'home' || currentScreen === 'verse') && (
                      <span className="absolute -top-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-gold dark:bg-gold-light"></span>
                    )}
                    <i className={`text-[20px] ${currentScreen === 'home' || currentScreen === 'verse' ? 'ph-fill' : 'ph'} ph-book-open`}></i>
                    <span className="font-display text-[8px] tracking-[0.18em] uppercase">Read</span>
                  </button>

                  {/* Journey */}
                  <button
                    onClick={() => navigateTo('journey')}
                    className={`relative flex flex-col items-center gap-1 w-[20%] transition-all duration-200 ${(currentScreen === 'journey' || currentScreen === 'prophet_detail') ? 'text-gold dark:text-gold-light' : 'text-ink/30 dark:text-slate-600 hover:text-gold/70 dark:hover:text-slate-400'}`}
                  >
                    {(currentScreen === 'journey' || currentScreen === 'prophet_detail') && (
                      <span className="absolute -top-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-gold dark:bg-gold-light"></span>
                    )}
                    <i className={`text-[20px] ${currentScreen === 'journey' || currentScreen === 'prophet_detail' ? 'ph-fill' : 'ph'} ph-compass`}></i>
                    <span className="font-display text-[8px] tracking-[0.18em] uppercase">Journey</span>
                  </button>

                  {/* Salawat */}
                  <button
                    onClick={() => navigateTo('salawat')}
                    className={`relative flex flex-col items-center gap-1 w-[20%] transition-all duration-200 ${currentScreen === 'salawat' ? 'text-gold dark:text-gold-light' : 'text-ink/30 dark:text-slate-600 hover:text-gold/60 dark:hover:text-slate-400'}`}
                  >
                    {currentScreen === 'salawat' && (
                      <span className="absolute -top-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-gold dark:bg-gold-light"></span>
                    )}
                    <i className={`text-[20px] ${currentScreen === 'salawat' ? 'ph-fill' : 'ph'} ph-heart`}></i>
                    <span className="font-display text-[8px] tracking-[0.18em] uppercase">Salawat</span>
                  </button>

                  {/* Shield */}
                  <button
                    onClick={() => navigateTo('protection')}
                    className={`relative flex flex-col items-center gap-1 w-[20%] transition-all duration-200 ${currentScreen === 'protection' ? 'text-gold dark:text-gold-light' : 'text-ink/30 dark:text-slate-600 hover:text-gold/60 dark:hover:text-slate-400'}`}
                  >
                    {currentScreen === 'protection' && (
                      <span className="absolute -top-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-gold dark:bg-gold-light"></span>
                    )}
                    <i className={`text-[20px] ${currentScreen === 'protection' ? 'ph-fill' : 'ph'} ph-shield-check`}></i>
                    <span className="font-display text-[8px] tracking-[0.18em] uppercase">Shield</span>
                  </button>

                  {/* Diary */}
                  <button
                    onClick={() => navigateTo('diary')}
                    className={`relative flex flex-col items-center gap-1 w-[20%] transition-all duration-200 ${currentScreen === 'diary' ? 'text-gold dark:text-gold-light' : 'text-ink/30 dark:text-slate-600 hover:text-gold/70 dark:hover:text-slate-400'}`}
                  >
                    {currentScreen === 'diary' && (
                      <span className="absolute -top-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-gold dark:bg-gold-light"></span>
                    )}
                    <i className={`text-[20px] ${currentScreen === 'diary' ? 'ph-fill' : 'ph'} ph-pen-nib`}></i>
                    <span className="font-display text-[8px] tracking-[0.18em] uppercase">Diary</span>
                  </button>
                </nav>

              </div>
            </div>
          );
        };

        // ─── Error Boundary ──────────────────────────────────────────────────────
        // Catches render errors anywhere in the tree so users never see a blank
        // white screen. Logs details to the console for debugging.
        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
          }

          static getDerivedStateFromError(error) {
            return { hasError: true, error };
          }

          componentDidCatch(error, info) {
            console.error('[Rūḥ] Render error:', error.message);
            console.error('[Rūḥ] Component stack:', info.componentStack);
          }

          render() {
            if (this.state.hasError) {
              return (
                <div className="app-viewport w-full flex items-center justify-center bg-parchment dark:bg-slate-950 px-8">
                  <div className="max-w-sm w-full text-center space-y-5">
                    <svg viewBox="0 0 100 100" className="w-10 h-10 mx-auto text-gold/40 dark:text-gold/30" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M50 5 L60 30 L85 15 L70 40 L95 50 L70 60 L85 85 L60 70 L50 95 L40 70 L15 85 L30 60 L5 50 L30 40 L15 15 L40 30 Z" strokeLinejoin="round"/>
                      <path d="M50 20 L58 42 L80 50 L58 58 L50 80 L42 58 L20 50 L42 42 Z" strokeLinejoin="round"/>
                      <circle cx="50" cy="50" r="10" />
                    </svg>
                    <div>
                      <h2 className="font-display text-xl text-ink dark:text-slate-200 tracking-wide">Something went still.</h2>
                      <p className="font-editorial text-sm italic text-ink/45 dark:text-slate-500 mt-2 leading-relaxed">
                        Rūḥ encountered an unexpected moment of silence.<br/>Your diary entries are safe in local storage.
                      </p>
                    </div>
                    <button
                      onClick={() => window.location.reload()}
                      className="inline-block px-6 py-2.5 bg-gold text-white font-editorial text-sm rounded-xl hover:bg-gold-dark transition-colors shadow-md shadow-gold/20"
                    >
                      Return to reflection
                    </button>
                    {this.state.error && (
                      <details className="text-left">
                        <summary className="font-display text-[9px] text-ink/25 dark:text-slate-700 uppercase tracking-widest cursor-pointer hover:text-ink/40 transition-colors">
                          Technical details
                        </summary>
                        <pre className="mt-2 text-[10px] text-ink/40 dark:text-slate-600 font-mono bg-white dark:bg-slate-900 rounded-lg p-3 overflow-auto max-h-32 border border-ink/8 dark:border-slate-800">
                          {this.state.error.message}
                        </pre>
                      </details>
                    )}
                  </div>
                </div>
              );
            }
            return this.props.children;
          }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
    </script>

    <!-- ─── Service Worker Registration + Version Polling ──────────────────
         Three-layer Safari cache defence:
         1. SW register — keeps the installable PWA shell active.
         2. version.json poll — async fetch on startup AND on every tab focus.
              On a mismatch it hard-navigates to ?v=<new-version>, which Safari
              treats as a brand-new URL and fetches fresh from Netlify.
              Future deploys: ONLY update /version.json — no need to touch
              the 486 KB index.html at all.
         3. bfcache fix — pageshow(persisted) forces a reload when Safari
              resurrects a frozen page from its back/forward cache.
         localStorage user data (diary, salawat, preferences) is never touched.
         ─────────────────────────────────────────────────────────────────── -->
    <script>
      // ── 1. Service worker registration ───────────────────────────────────
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () { /* silent */ });
        });
      }

      // ── 2. Async version.json polling ────────────────────────────────────
      // Fetches /version.json with cache-busting on every check so Safari
      // can never serve a stale copy. On version mismatch → hard reload.
      // This catches: long-lived tabs, background tabs, iOS PWA installs,
      // and any scenario where the sync check at the top of <head> was
      // bypassed (e.g. bfcache restore that slipped past the pageshow handler).
      (function () {
        function checkVersion() {
          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              var latest = data && data.v;
              if (!latest) return;
              // Uses a SEPARATE key ('ruh-deploy-version') from the inline sync
              // check ('ruh-app-version') so the two systems never interfere with
              // each other or cause redirect loops.
              var stored = localStorage.getItem('ruh-deploy-version');
              if (stored !== latest) {
                localStorage.setItem('ruh-deploy-version', latest);
                // Only redirect if we are not already on this version's URL
                // to prevent redirect loops.
                if (window.location.search.indexOf('v=' + latest) === -1) {
                  window.location.replace(window.location.pathname + '?v=' + encodeURIComponent(latest));
                }
              }
            })
            .catch(function () { /* silent — never break the app on network error */ });
        }

        // Run once on startup (catches tabs that were open across a deploy).
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkVersion);
        } else {
          checkVersion();
        }

        // Run whenever the tab re-gains focus (catches background-tab scenario
        // where the user left the tab open overnight then switched back to it).
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkVersion();
        });
      })();

      // ── 3. bfcache fix ───────────────────────────────────────────────────
      // Safari's back/forward cache freezes a page in memory and restores it
      // without any network request. event.persisted === true means the page
      // came from bfcache → force a reload to get the live version.
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          window.location.reload();
        }
      });
    </script>
