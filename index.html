              desc: "Defeating the giant Jalut (Goliath) and praising Allah with the echoing mountains.", status: "available",
              reference: "Quran 38:17-26; Sunan at-Tirmidhi 3490.",
              story: "As an unknown, young shepherd, Dawud brought down the heavily armored, giant tyrant Jalut with a simple sling, proving that divine support always overcomes physical might. He was granted a vast kingdom, the Psalms (Zabur), and a voice so beautiful that mountains and birds would literally join him in glorifying Allah. Despite his absolute royal power, he fasted alternate days, worked with his hands, and wept often in repentance.",
              dua: {
                arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ حُبَّكَ وَحُبَّ مَنْ يُحِبُّكَ وَالْعَمَلَ الَّذِي يُبَلِّغُنِي حُبَّكَ",
                translation: "O Allah, I ask You for Your love, the love of those who love You, and the deeds that will bring me to Your love.",
                context: "Recorded in Tirmidhi as the beautiful, deeply poetic supplication of King Dawud."
              },
              lessons: [
                "Massive worldly power and immense wealth can seamlessly coexist with profound humility and devotion to God.",
                "No giant or obstacle in your life is too big to fall if Allah's support is with you.",
                "Always be quick to realize your mistakes and rush to repentance, regardless of your high status."
              ]
            },
            { 
              id: 19, name: "Sulayman (AS)", title: "The Majestic Ruler", 
              desc: "Command over the wind and jinn, tested by unimaginable wealth and absolute authority.", status: "available",
              reference: "Quran 27:19.",
              story: "The son of Dawud, Sulayman was given a magnificent kingdom unlike any before or after him. He could control the wind, command the unseen jinn, and understand the intricate languages of animals and insects. Yet, when he saw his majestic throne and his immense power, his first words were not of pride, but: 'This is by the Grace of my Lord to test me whether I am grateful or ungrateful.'",
              dua: {
                arabic: "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ",
                translation: "My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents and to do righteousness of which You approve.",
                context: "His prayer of immense gratitude after hearing a tiny ant speak, realizing God gave him the ability to hear it."
              },
              lessons: [
                "True gratitude is recognizing that all your talents, intelligence, and wealth are tests, not entitlements.",
                "Power, resources, and influence should be used to establish justice and invite others to the truth.",
                "Even with control over the world, a believer's heart remains attached only to the Creator of the world."
              ]
            },
            { 
              id: 20, name: "Ilyas (AS)", title: "The Prophet of Ba'albek", 
              desc: "Reviving pure monotheism in a dark time of severe idol worship and drought.", status: "available",
              reference: "Quran 37:123-132.",
              story: "Sent to a people who had completely abandoned the worship of Allah to worship the golden idol Ba'al. Ilyas fearlessly confronted their arrogant king and corrupt priests, warning them of the spiritual and physical drought their idolatry would bring. He suffered severe persecution, hiding in caves, but remained an unyielding, fierce defender of monotheism.",
              lessons: [
                "Standing up against corrupt authority and systemic falsehood requires immense spiritual fortitude.",
                "The truth remains the truth, even if the vast majority of society completely abandons it.",
                "Do not let fear of losing your livelihood or status stop you from speaking out against clear injustice."
              ]
            },
            { 
              id: 21, name: "Al-Yasa (AS)", title: "The Successor", 
              desc: "Continuing the heavy mission of Ilyas with quiet guidance, miracles, and deep wisdom.", status: "available",
              reference: "Quran 38:48.",
              story: "The dedicated student and designated successor to Ilyas, Al-Yasa faithfully continued the incredibly difficult work of guiding the Israelites. He carried the heavy torch of prophethood, navigating the complex political and spiritual turmoil of his time, acting as a steady hand of divine guidance and performing miracles when the community threatened to splinter entirely.",
              lessons: [
                "Mentorship and succession are absolutely crucial in preserving the legacy of faith and knowledge.",
                "Quiet, consistent, day-to-day leadership is just as vital as dramatic, historical confrontations.",
                "Honor your teachers by carrying their good works forward after they are gone."
              ]
            },
            { 
              id: 22, name: "Yunus (AS)", title: "The Companion of the Fish", 
              desc: "The fleeing prophet, the terrifying darkness of the whale, and the power of tasbih.", status: "available",
              reference: "Quran 21:87; Sunan at-Tirmidhi 3505.",
              story: "Deeply frustrated by his people's stubbornness, Yunus made a human error: he abandoned his mission before Allah permitted him to leave. He boarded a ship, was thrown overboard in a raging storm, and swallowed by a massive whale. In the terrifying, suffocating triple darkness of the night, the ocean, and the whale's belly, he uttered the ultimate prayer of admission: 'There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.' He was rescued, and his people, seeing the signs, entirely repented.",
              dua: {
                arabic: "لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",
                translation: "There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.",
                context: "The Prophet ﷺ said: 'No Muslim supplicates with it for anything except that Allah answers him.' (Tirmidhi)"
              },
              lessons: [
                "You cannot run away from God; you can only run toward Him.",
                "Deep, sincere repentance in the darkest, most isolated places of your life can fundamentally change your destiny.",
                "Never give up on people; Yunus's people eventually became the only entire city to repent and be saved."
              ]
            },
            { 
              id: 23, name: "Zakariyya (AS)", title: "The Guardian of Maryam", 
              desc: "A silent, desperate prayer in old age answered with a miraculous son.", status: "available",
              reference: "Quran 21:89.",
              story: "An elderly priest entrusted with the care of the young Maryam. Seeing the miraculous, out-of-season fruit Allah sent to Maryam in her sanctuary, Zakariyya's dormant hope was suddenly reignited. Despite his extreme old age, fragile bones, and his wife's lifelong barrenness, he made a secret, desperate, weeping prayer for an heir to continue the spiritual work. Allah answered the impossible by gifting him Yahya.",
              dua: {
                arabic: "رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ",
                translation: "My Lord, do not leave me alone [with no heir], while You are the best of inheritors.",
                context: "A profound prayer for legacy, offspring, and overcoming the deep ache of loneliness."
              },
              lessons: [
                "Never stop making dua, even when absolutely all physical, medical, and logical odds are stacked against you.",
                "Witnessing the pure faith of the youth can beautifully inspire and reignite the hope of the elders.",
                "God loves the secret, sincere, and desperate whispers of a broken heart."
              ]
            },
            { 
              id: 24, name: "Yahya (AS)", title: "The Chaste and Noble", 
              desc: "Granted intense wisdom while still a child, a paragon of purity and gentleness.", status: "available",
              reference: "Quran 19:12-15.",
              story: "The miracle son of Zakariyya, Yahya (John) was granted immense wisdom, scripture, and emotional intelligence while still a young boy. He was known for his extraordinary compassion for all creatures, his absolute purity, and his profound gentleness and obedience toward his parents. He bravely spoke truth to power, holding the corrupt rulers of his time morally accountable, eventually sacrificing his life for the truth.",
              lessons: [
                "Physical age is not a barrier to possessing profound spiritual wisdom, piety, and leadership.",
                "Extreme gentleness of the heart must be coupled with the fierce courage to speak the truth.",
                "True success is living a life of absolute integrity, regardless of how the world treats you."
              ]
            },
            { 
              id: 25, name: "Isa (AS)", title: "The Spirit from Allah", 
              desc: "The miraculous birth, healing the blind, and speaking truth from the cradle.", status: "available",
              reference: "Quran 19:30-33; Sahih al-Bukhari 3438.",
              story: "Born miraculously to the virgin Maryam, Isa (Jesus) spoke eloquently from the cradle to defend his mother's honor against the vicious slander of her community. He was a breath of pure spirituality sent to a heavily legalized, rigid society. By God's exact permission, he healed the blind, cured the lepers, and brought the dead back to life, aggressively reminding humanity that the true spirit of the law is mercy, healing, and profound love for God.",
              lessons: [
                "True religion is not just a rigid set of rules; it is profound compassion, charity, and healing for the broken.",
                "Allah fiercely defends those who are wrongfully accused and place their reliance entirely on Him.",
                "Do not let the harsh judgments of society break your spirit when you know you are walking on truth."
              ]
            }

          const salawatCollection = [
            { id: "azimiyah", name: "Salawat Azimiyah", arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ بِنُورِ وَجْهِ اللَّهِ الْعَظِيمِ. الَّذِي مَلَأَ أَرْكَانَ عَرْشِ اللَّهِ الْعَظِيمِ. وَقَامَتْ بِهِ عَوَالِمُ اللَّهِ الْعَظِيمِ. أَنْ تُصَلِّيَ عَلَى مَوْلَانَا مُحَمَّدٍ ذِي الْقَدْرِ الْعَظِيمِ. وَعَلَى آلِ نَبِيِّ اللَّهِ الْعَظِيمِ. بِقَدْرِ عَظَمَةِ ذَاتِ اللَّهِ الْعَظِيمِ. فِي كُلِّ لَمْحَةٍ وَنَفَسٍ، عَدَدَ مَا فِي عِلْمِ اللَّهِ الْعَظِيمِ. صَلَاةً دَائِمَةً بِدَوَامِ اللَّهِ الْعَظِيمِ. تَعْظِيمًا لِحَقِّكَ يَا مَوْلَانَا يَا مُحَمَّدُ يَا ذَا الْخُلُقِ الْعَظِيمِ. وَسَلِّمْ عَلَيْهِ وَعَلَى آلِهِ مِثْلَ ذَلِكَ، وَاجْمَعْ بَيْنِي وَبَيْنَهُ كَمَا جَمَعْتَ بَيْنَ الرُّوحِ وَالنَّفْسِ، ظَاهِرًا وَبَاطِنًا، يَقْظَةً وَمَنَامًا، وَاجْعَلْهُ يَا رَبِّ رُوحًا لِذَاتِي مِنْ جَمِيعِ الْوُجُوهِ فِي الدُّنْيَا قَبْلَ الْآخِرَةِ يَا عَظِيمُ.", transliteration: "Allahumma inni as'aluka bi-nuri wajhillahil 'azim. Alladhi mala'a arkana 'arshillahil 'azim. Wa qomat bihi 'awalimullahil 'azim. An tusalliya 'ala mawlana Muhammadin dzil-qadril 'azim. Wa 'ala ali nabiyyillahil 'azim. Bi-qadri 'azamati dzatillahil 'azim. Fi kulli lamhatin wa nafasin 'adada ma fi 'ilmillahil 'azim. Solatan da'imatan bi-dawamillahil 'azim. Ta'ziman li-haqqika ya mawlana ya Muhammadu ya dzhal-khuluqil 'azim. Wa sallim 'alayhi wa 'ala alihi mithla dzhalik. Wajma' bayni wa baynahu kama jama'ta baynarruhi wannafs, zahiran wa batina, yaqozatan wa ma naama. Waj'alhu ya Rabbi ruhal li-dzhati min jami'il wujuhi fiddunya qablal akhirati, ya 'azim.", meaning: "O Allah, I ask You by the Light of the Face of Allah, the Magnificent, which filled the pillars of the Throne of Allah, the Magnificent, and by which the worlds of Allah, the Magnificent, are upheld, to send blessings upon our Master Muhammad of magnificent rank, and upon the family of the Prophet of Allah, the Magnificent, as great as the greatness of the Essence of Allah, the Magnificent, in every glance and breath, as numerous as what is in the Knowledge of Allah, the Magnificent... and unite me with him just as You have united the spirit and the soul, outwardly and inwardly, awake and asleep.", benefit: "From Imam Ahmad Ibn Idris. A monumental Salawat known to elevate the reciter to profound spiritual ranks, unifying their spirit with the spirit of the Prophet ﷺ." },
            { id: "roohi", name: "Salawat Roohi (To See The Prophet ﷺ in Dreams)", arabic: "اللَّهُمَّ صَلِّ عَلَى رُوحِ سَيِّدِنَا مُحَمَّدٍ فِي الأَرْوَاحِ وَعَلَى جَسَدِهِ فِي الأَجْسَادِ وَعَلَى قَبْرِهِ فِي الْقُبُورِ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ", transliteration: "Allahumma salli 'ala roohi Sayyidina Muhammadin fi l-arwaahi wa 'ala jasadihi fi l-ajsaadi wa 'ala qabrihi fi l-quboori wa 'ala aalihi wa sahbihi wa sallim.", meaning: "O Allah! Shower Your Blessings on the soul of Prophet Muhammad amongst all souls, and on the body of Prophet Muhammad amongst all bodies, and on the grave of Prophet Muhammad amongst all graves.", benefit: "Imam Sha'arani related: Whoever makes salawat in this way will see me in the dream, whoever sees me in the dream will see me on the Day of Judgment, whoever sees me on the Day of Judgment I will intercede for him." },
            { id: "paling_tinggi", name: "Salawat Paling Tinggi (Jazallahu Anna)", arabic: "جَزَى اللَّهُ عَنَّا سَيِّدَنَا مُحَمَّدًا صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِمَا هُوَ أَهْلُهُ", transliteration: "Jazallahu 'anna Sayyidina Muhammadan Sallallahu 'Alaihi Wa Sallam ma huwa ahluhu.", meaning: "May Allah reward our Master Muhammad, peace and blessings be upon him, on our behalf with a reward he truly deserves.", benefit: "Known as the Highest Salawat. Reading it will tire out 70 recording angels who will continuously write its immense reward for 1000 mornings." },
            { id: "miftah", name: "Salawat Miftah (The Key)", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ مِفْتَاحِ بَابِ رَحْمَةِ اللَّهِ عَدَدَ مَا فِي عِلْمِ اللَّهِ صَلَاةً وَسَلَامًا دَائِمَيْنِ بِدَوَامِ مُلْكِ اللَّهِ", transliteration: "Allahumma salli wa sallim 'ala sayyidina Muhammadin miftahi baabi rahmatillah, 'adada ma fi 'ilmillah, salatan wa salaman daa'imayni bidawami mulkillah.", meaning: "O Allah, bestow blessings and peace upon our Master Muhammad, the key to the door of Allah's mercy, as numerous as what is in the knowledge of Allah, eternal blessings and peace, lasting as long as the Kingdom of Allah.", benefit: "A powerful wasilah to see the Prophet ﷺ in a dream. Habib Ali Al-Habsyi stated that reading it just once with true love is sufficient." },
            { id: "pembuka_kebaikan", name: "Shalawat Pembuka Kebaikan", arabic: "يَارَبِّ صَلِّ عَلَى مُحَمَّدٍ وَافْتَحْ مِنَ الْخَيْرِ كُلَّ مُغْلَقٍ", transliteration: "Ya Robbi Sholli 'Ala Muhammad, Waftah Minal Khoiri Kulla Mughlaq.", meaning: "O my Lord, bestow blessings upon Prophet Muhammad ﷺ, and open every locked door of goodness.", benefit: "Found in the Simthuddurrar Maulid by Habib Ali bin Muhammad Al Habsyi. Recited 10x after Subuh and Asar to open all locked doors of goodness and sustenance." },
            { id: "100k", name: "Salawat 100,000 (Sholawat Abdika)", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَبْدِكَ وَنَبِيِّكَ وَرَسُولِكَ النَّبِيِّ الأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ تَسْلِيمًا بِقَدْرِ عَظَمَةِ ذَاتِكَ فِي كُلِّ وَقْتٍ وَحِينٍ", transliteration: "Allahumma sholli ala Sayyidina Muhammadin abdika wa nabiyyika wa rasulika, an nabiyy al umiyy Wa'ala alihi wasohbihi wassalim taslima bi qodri azhomati zhatika fi kulli waqtin wahin.", meaning: "O Allah, send blessings upon our Master Muhammad, Your servant, Prophet, and Messenger, the Unlettered Prophet, and upon his family and companions, and grant them abundant peace, as great as the greatness of Your Essence, in every time and moment.", benefit: "Reading this formulation just 1x is equivalent to the reward of reading 100,000 Salawat." },
            { id: "nur", name: "Salawat Nur", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ نُورِكَ السَّارِي وَمَدَدِكَ الْجَارِي وَاجْمَعْنِي بِهِ فِي كُلِّ أَطْوَارِي وَعَلَى آلِهِ وَصَحْبِهِ يَا نُورُ", transliteration: "Allahumma shalli wa sallim 'ala sayyidina muhammad nuuri-kas saari wa madadikal jari wajma'ni bihi fi kulli athwaari wa 'ala alihi wa shahbihi ya nuur.", meaning: "O Allah, send blessings and peace upon our master Muhammad, Your penetrating light and flowing support, and unite me with him in all my states, and upon his family and companions, O Light.", benefit: "Taught by Habib Umar Bin Hafidz, it serves as a powerful means to deeply bind the heart with Rasulullah ﷺ in every state of life." },
            { id: "mansub", name: "Salawat Mansub", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلَاةً تَغْفِرُ بِهَا الذُّنُوبَ وَتُصْلِحُ بِهَا الْقُلُوبَ وَتَنْطَلِقُ بِهَا الْعُصُوبُ وَتَلِينُ بِهَا الصُّعُوبُ وَعَلَى آلِهِ وَصَحْبِهِ وَمَنْ إِلَيْهِ مَنْسُوبٌ", transliteration: "Allahumma sholli 'ala Sayyidina Muhammadin sholatan taghfiru bihadz-dzunuub wa tushlihu bihal quluub wa tantholiqu bihal ushuub wa taliinu bihash-shu'uub wa 'ala aalihi wa shohbihi wa man ilaihi mansuub.", meaning: "O Allah, bestow blessings upon our Master Muhammad, a blessing by which You forgive sins, rectify hearts, release tensions, and soften difficulties, and upon his family, companions, and those attributed to him.", benefit: "From Al-Habib Sholeh bin Muhsin Al-Hamid. Eases all difficulties, repairs the heart, and brings relief from overwhelming stress." },
            { id: "ulul_azmi", name: "Salawat Ulul Azmi", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَآدَمَ وَنُوحٍ وَإِبْرَاهِيمَ وَمُوسَى وَعِيسَى وَمَا بَيْنَهُمْ مِنَ النَّبِيِّينَ وَالْمُرْسَلِينَ صَلَوَاتُ اللَّهِ وَسَلَامُهُ عَلَيْهِمْ أَجْمَعِينَ", transliteration: "Allaahumma shalli 'alaa sayyidinaa Muhammadin wa Adama wa Nuhin wa Ibraahiima Wa Muusaa Wa 'Isa wa Maa Bainahum Minan Nabiyyiina wal Mursaliina Shalawaatullaahi wa Salaamuuhu 'Alaihim Ajma'iin.", meaning: "O Allah, send blessings upon our Master Muhammad, Adam, Nuh, Ibrahim, Musa, and Isa, and all the Prophets and Messengers between them. May the blessings and peace of Allah be upon them all.", benefit: "Reading it 3 times is like completing the entire Dalail al-Khayrat. It acts as a shield against calamities and opens doors of sustenance." },
            { id: "green_light", name: "Salawat of the Green Light (Tadumu)", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ عَلَيْهِ السَّلَامُ صَلَاةً تَدُومُ وَتُهْدَى إِلَيْهِ مَا مَرَّ اللَّيَالِ وَطُولَ الدَّوَامِ", transliteration: "Allahumma salli wa sallim 'ala nabiyyina Muhammad 'alayhi 's-salam salatan tadumu wa tuhda ilayhi ma marra 'l-layali wa thula 'd-dawam.", meaning: "O Allah, send blessings and peace upon our Prophet Muhammad, upon him be peace, a continuous blessing that is gifted to him as long as the nights pass and for all eternity.", benefit: "Nothing appears except the green light of Rasulullah ﷺ when recited. Reciting it 1, 3, or 100 times opens the spiritual realm to be dressed by this light." },
            { id: "1000_hari", name: "Salawat 1000 Hari", arabic: "اللَّهُمَّ يَا رَبَّ سَيِّدِنَا مُحَمَّدٍ وَآلِ سَيِّدِنَا مُحَمَّدٍ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ وَاجْزِ سَيِّدَنَا مُحَمَّدًا صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَا هُوَ أَهْلُهُ", transliteration: "Allahumma ya Robba Sayyidina Muhammadin wa Aali Sayyidina Muhammadin sholli 'ala Sayyidina Muhammadin wa 'ala Aali Sayyidina Muhammadin wajzi Sayyidana Muhammadan shollallahu 'alaihi wa sallama ma huwa ahluh.", meaning: "O Allah, O Lord of our Master Muhammad and the family of our Master Muhammad, send blessings upon our Master Muhammad and the family of our Master Muhammad, and reward our Master Muhammad ﷺ with what he is worthy of.", benefit: "Whoever reads this 1x at Subuh and 1x at Asar, Allah will forgive their sins and the sins of their parents, and angels will write rewards for them for 1000 days." },
            { id: "1000_subuh", name: "Salawat 1000 Subuh (Ya Robba Muhammadin)", arabic: "اللَّهُمَّ يَا رَبَّ مُحَمَّدٍ وَآلِ مُحَمَّدٍ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ وَاجْزِ مُحَمَّدًا صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَا هُوَ أَهْلُهُ", transliteration: "Allahumma ya Robba Muhammadin wa aali Muhammadin, sholli 'ala Muhammadin wa 'ala aali Muhammadin, wazji Muhammadan shollallahu 'alaihi wa sallama ma huwa ahluh.", meaning: "O Allah, O Lord of Muhammad and the family of Muhammad, send blessings upon Muhammad and the family of Muhammad, and reward Muhammad ﷺ with what he is worthy of.", benefit: "The angels Raqib and Atid will tirelessly write the immense reward for 1000 mornings." },
            { id: "haqiqah", name: "Salawat Haqiqatul Muhammadiyah", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا وَمَوْلَانَا أَحْمَدَ، الَّذِي جَعَلْتَ اسْمَهُ مُتَّحِدًا بِاسْمِكَ وَنَعْتِكَ، وَصُورَةَ هَيْكَلِهِ الْجُسْمَانِيِّ عَلَى صُورَةِ أُنْمُوذَجِ حَقِيقَةِ خَلْقِ اللَّهِ سَيِّدِنَا آدَمَ عَلَى صُورَتِهِ، وَفَجَّرْتَ عُنْصُرَ مَوْضُوعِ مَادَّةِ مَحْمُولِهِ مِنْ أَنِّيَّةِ أَنَا اللَّهُ، بَلْ حَتَّى إِذَا جَاءَهُ لَمْ يَجِدْهُ شَيْئًا وَوَجَدَ اللَّهَ عِنْدَهُ، وَآلِهِ وَصَحْبِهِ وَسَلِّمْ", transliteration: "Allahumma salli 'ala sayyidina wa mawlana Ahmad, alladhi ja'alta ismahu muttahidan bismika wa na'tika, wa surata haykalihi al-jusmaniyyi 'ala surati unmudhaji haqiqati khalqi Allahi sayyidina Adam 'ala suratihi... wa alihi wa sahbihi wa sallim.", meaning: "O Allah, bless our Master Ahmad, whose name You have united with Your Name and Attribute, whose physical form is the archetype of the reality of Allah's creation, our master Adam, created in his image... and upon his family and companions, send peace.", benefit: "An incredibly deep, esoteric Salawat. Used by spiritual masters to build a profound inner connection to the spiritual reality (Haqiqah) of the Prophet ﷺ." },
            { id: "karimil_aba", name: "Sholawat Karimil Aba-i Wal Ummahat", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ كَرِيمِ الْآبَاءِ وَالْأُمَّهَاتِ", transliteration: "Alloohumma sholli wasallim wabaarik 'alaa sayyidinaa muhammadin kariimil aa-baa-i wal ummahaat.", meaning: "O Allah, pour out blessings, peace, and grace upon our Master Muhammad, who possesses a noble lineage through both his father and mother.", benefit: "Read 10x morning/evening and 3x after Fard prayers. Practicing it for 40 days is known to open vast outpourings of sustenance, smooth economic affairs, and bring immense love for Rasulullah ﷺ." },
            { id: "tajiyyah", name: "Sholawat Tajiyyah (Mahkota)", arabic: "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ. اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ وَكَرِّمْ بِقَدْرِ عَظَمَةِ ذَاتِكَ الْعَلِيَّةِ، فِي كُلِّ وَقْتٍ وَحِينٍ أَبَدًا، عَدَدَمَا عَلِمْتَ وَزِنَةَ مَا عَلِمْتَ وَمِلْءَ مَا عَلِمْتَ، عَلَى سَيِّدِنَا وَمَوْلَانَا مُحَمَّدٍ، وَعَلَى آلِ سَيِّدِنَا وَمَوْلَانَا مُحَمَّدٍ صَاحِبِ التَّاجِ، وَالْمِعْرَاجِ، وَالْبُرَاقِ، وَالْعَلَمِ، وَدَافِعِ الْبَلَاءِ، وَالْوَبَاءِ، وَالْمَرَضِ وَالْأَلَمِ، جِسْمُهُ مُطَهَّرٌ مُعَطَّرٌ مُنَوَّرٌ، مَنْ اسْمُهُ مَكْتُوبٌ مَرْفُوعٌ مَوْضُوعٌ عَلَى اللَّوْحِ وَالْقَلَمِ، شَمْسِ الضُّحَى بَدْرِ الدُّجَى نُورِ الْهُدَى، مِصْبَاحِ الظُّلَمِ، أَبِي الْقَاسِمِ سَيِّدِنَا مُحَمَّدِ بْنِ عَبْدِ اللَّهِ سَيِّدِ الْعَرَبِ وَالْعَجَمِ نَبِيِّ الْحَرَمَيْنِ مَحْبُوبٍ عِنْدَ رَبِّ الْمَشْرِقَيْنِ وَالْمَغْرِبَيْنِ يَاأَيُّهَا الْمُشْتَاقُونَ لِنُورِ جَمَالِهِ صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا", transliteration: "Bismillaahir rahmaanir rahiim. Allaahumma sholli wa sallim wa baarik wa karrim bi qodri 'adhomati dzaatikal 'aliyyah, fii kulli waqtin wa hiinin abada 'adadamaa 'alimta wa zinata maa 'alimta wa mil-a maa 'alimta, 'alaa sayyidinaa wa maulaanaa muhammadin wa 'alaa aali sayyidinaa wa maulaanaa muhammadin shoohibit taaji wal mi'rooji wal burooqi wal 'alami wa daafi'il balaa-i wal wabaa-i wal marodli wal alami jismuhu muthohharun mu'ath-thorun munawwarun man ismuhu maktuubu marfuu'un maudluu'un 'alal lauhi wal qolami syamsidl-dluhaa badrid-dujaa nuuril hudaa mishbaahidh-dhulami abil qoosim sayyidinaa muhammadibni 'abdillaahi sayyidil 'arobi wal 'ajami nabiyyil haramaini mahbuubun 'inda robbil masyriqoini wal maghribaini yaa ayyuhal musytaa-quuna linuuri jamaalihi sholluu 'alaihi wa sallimuu tasliima.", meaning: "O Allah, send blessings, peace, grace, and honor by the greatness of Your High Essence... upon our Master Muhammad, and his family. The owner of the crown, the ascension, the buraq, and the flag; the repeller of calamity, plague, illness, and pain. His body is purified, perfumed, and illuminated...", benefit: "Read 1x after Maghrib and Subuh. Distances from calamities, plagues, illnesses, sadness, and difficulties. Elevates one's status, and guarantees intercession until the Day of Judgment." },
            { id: "ilmu_ladunni", name: "Salawat Ilmu Ladunni", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ فِي كُلِّ لَمْحَةٍ وَنَفَسٍ بِعَدَدِ كُلِّ مَعْلُومٍ لَكَ", transliteration: "Allahumma sholli wa sallim 'ala sayyidina Muhammadin wa 'ala aali sayyidina Muhammadin fi kulli lamhatin wa nafasin bi'adadi kulli ma'luumin lak.", meaning: "O Allah, send blessings and peace upon our Master Muhammad and upon the family of our Master Muhammad, in every glance and every breath, as numerous as all that is known to You.", benefit: "Read Ayatul Kursi 1x, then follow it with this Salawat. It is said that almost everyone who practices this receives Ilmu Ladunni (divinely inspired spiritual knowledge)." },
            { id: "muwasala", name: "Salawat Muwasala", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ وَعَلَى أَصْحَابِ سَيِّدِنَا مُحَمَّدٍ وَعَلَى أَنْصَارِ سَيِّدِنَا مُحَمَّدٍ وَعَلَى أَزْوَاجِ سَيِّدِنَا مُحَمَّدٍ وَعَلَى ذُرِّيَّةِ سَيِّدِنَا مُحَمَّدٍ وَسَلِّمْ تَسْلِيمًا كَثِيرًا", transliteration: "Allahumma salli 'ala sayyidina Muhammad, wa 'ala ali sayyidina Muhammad, wa 'ala ashabi sayyidina Muhammad, wa 'ala ansari sayyidina Muhammad, wa 'ala azwaji sayyidina Muhammad, wa 'ala dhurriyyati sayyidina Muhammad, wa sallim tasliman kathiran.", meaning: "O Allah, send blessings upon our Master Muhammad, and upon the family, the companions, the helpers, the wives, and the offspring of our Master Muhammad, and grant them abundant peace.", benefit: "A comprehensive Salawat sending abundant peace upon the Prophet ﷺ and all those closely connected to him." },
            { id: "jibril", name: "Salawat Jibril", arabic: "صَلَّى اللَّهُ عَلَى مُحَمَّدٍ", transliteration: "Shallallahu 'ala Muhammad.", meaning: "May Allah send blessings upon Muhammad.", benefit: "Reciting this 500 or 1000 times a day attracts immense sustenance. After completing your daily count, recite the specific Doas below.", postDuas: [{ title: "Do'a Ijazah KH. Kholil Bisri", arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ وَأَتَوَجَّهُ إِلَيْكَ بِنَبِيِّكَ مُحَمَّدٍ نَبِيِّ الرَّحْمَةِ. يَا سَيِّدِي يَامُحَمَّدُ إِنِّي أَتَوَسَّلُ بِكَ إِلَى رَبِّي فَشَفِّعْهُ فِيَّ لِقَضَاءِ حَاجَاتِي، وَهِيَ...", transliteration: "Allahumma inni as'aluka wa atawajjahu ilaika binabiyyika Muhammadin nabiyyir-rahmah. Ya Sayyidi Ya Muhammad, inni atawassalu bika ila Rabbi fashaffi'hu fiyya liqadha'i hajati, wa hiya... [state your need]", meaning: "O Allah, I ask You and turn to You through Your Prophet Muhammad, the Prophet of Mercy. O my master, O Muhammad, I seek your intercession to my Lord so that He may fulfill my needs, which are... [state your need]" }, { title: "Do'a Pembuka Rezeki", arabic: "اللَّهُمَّ أَعْطِنِي ثَوَابَ صَلَّى اللَّهُ عَلَى مُحَمَّدٍ أَنْ تَرْزُقَنِي شَيْئًا أَسْتَعِينُ بِهِ عَلَى الطَّاعَةِ سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ وَسَلَامٌ عَلَى الْمُرْسَلِينَ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", transliteration: "Allahumma a'thini thawaba shallallahu 'ala Muhammadin an tarzuqoni syai'an asta'inu bihi 'alath-tho'ati. Subhana rabbika rabbil 'izzati 'amma yashifuun, wa salamun 'alal mursaliin, wal hamdulillahi rabbil 'alamiin.", meaning: "O Allah, grant me the reward of 'Shallallahu 'ala Muhammad' and provide me with something that helps me in obedience to You. Exalted is your Lord, the Lord of Might, above what they describe. And peace be upon the messengers, and all praise is due to Allah, Lord of the worlds." }] },
            { id: "jawharat", name: "Jawharat al-Kamal", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى عَيْنِ الرَّحْمَةِ الرَّبَّانِيَّةِ وَالْيَاقُوتَةِ الْمُتَحَقِّقَةِ الْحَائِطَةِ بِمَرْكَزِ الْفُهُومِ وَالْمَعَانِي ❁ وَنُورِ الْأَكْوَانِ الْمُتَكَوِّنَةِ الْآدَمِيِّ صَاحِبِ الْحَقِّ الرَّبَّانِي ❁ الْبَرْقِ الْأَسْطَعِ بِمُزُونِ الْأَرْبَاحِ الْمَالِئَةِ لِكُلِّ مُتَعَرِّضٍ مِنَ الْبُحُورِ وَالْأَوَانِي ❁ وَنُورِكَ اللَّامِعِ الَّذِي مَلَأْتَ بِهِ كَوْنَكَ الْحَائِطَ بِأَمْكِنَةِ الْمَكَانِي ❁ اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى عَيْنِ الْحَقِّ الَّتِي تَتَجَلَّى مِنْهَا عُرُوشُ الْحَقَائِقِ عَيْنِ الْمَعَارِفِ الْأَقْوَمِ صِرَاطِكَ التَّامِّ الْأَسْقَمِ ❁ اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى طَلْعَةِ الْحَقِّ بِالْحَقِّ الْكَنْزِ الْأَعْظَمِ إِفَاضَتِكَ مِنْكَ إِلَيْكَ إِحَاطَةِ النُّورِ الْمُطَلْسَمِ ❁ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ صَلَاةً تُعَرِّفُنَا بِهَا إِيَّاهُ ❁", transliteration: "Allahumma salli wa sallim 'alaa 'aynir-rahmatir-rabbaniyyati wal-yaqootatil mutahaqqiqatil haa'iTati bimarkazil-fuhumi wal-ma'aani. Wa nuril-akwanil-mutakawwinatil-adamiyyi sahibil-haqqir-rabbani... Sallallahu 'alayhi wa 'alaa aalihi salatan tu'arrifuna biha iyyahu.", meaning: "O Allah, send blessings and peace upon the Source of Divine Mercy, the true ruby encompassing the center of comprehensions and meanings... May Allah bless him and his family, a prayer which brings us to knowledge of him.", benefit: "Spiritual masters describe it as the 'Jewel of Perfection' used for deep spiritual openings and immense light." },
            { id: "aali_qadr", name: "Salaat al-'Aali al-Qadr", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الأُمِّيِّ الْحَبِيبِ الْعَالِي الْقَدْرِ الْعَظِيمِ الْجَاهِ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ", transliteration: "Allahumma salli wa sallim wa barik 'alaa Sayyidina Muhammad an-Nabiyyi 'l-Umiyy al-Habeebi 'l-'alil-qadri 'l-'azheemi 'l-jaahi wa 'alaa aalihi wa sahbihi wa sallim.", meaning: "O Allah exalt, greet, and bless our master Muhammad the Unlettered Prophet, the Beloved of Highest Value, Possessing Immense Status, and on his family and companions, and send them peace.", benefit: "Whoever recites this regularly every Thursday night will see the blessed countenance of Rasulullah ﷺ at the time of death and entering the grave." },
            { id: "shafii", name: "Durood Shafi'i", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ كُلَّمَا ذَكَرَهُ الذَّاكِرُونَ وَكُلَّمَا غَفَلَ عَنْ ذِكْرِهِ الْغَافِلُونَ", transliteration: "Allahumma salli 'alaa Muhammadin kullama dhakarahu dhakiroon, wa kullama ghafala 'an dhikrihil ghafiloon.", meaning: "O Allah, send blessings upon Muhammad as long as those who remember him remember him, and as long as those who neglect to remember him neglect him.", benefit: "Reciting this unique continuous form earned Imam Ash-Shafi'i the special honor of being excused from reckoning on the Day of Qiyamah." },
            { id: "kamaliyah", name: "Selawat Kamaliyah", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ كَمَا لا نِهَايَةَ لِكَمَالِكَ وَعَدَدَ كَمَالِهِ", transliteration: "Allahumma salli wa sallim wa baarik 'alaa Sayyidina Muhammadin wa 'alaa aalihi kamaa laa nihayata likamalika wa 'adada kamalihi.", meaning: "O Allah, bestow blessings, peace, and grace upon our Master Prophet Muhammad and his family, just as there is no end to Your perfection, and as numerous as his perfections.", benefit: "Known to safeguard and preserve knowledge. Reading it regularly helps one retain and memorize what they have studied." },
            { id: "saadatu_darain", name: "Salawat Sa'adatu Darain", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَأَصْحَابِهِ وَأَزْوَاجِهِ وَذُرِّيَّتِهِ وَأَهْلِ بَيْتِهِ عَدَدَ مَا فِي عِلْمِكَ صَلَاةً دَائِمَةً بِدَوَامِ مُلْكِكَ", transliteration: "Allahumma salli 'alaa Sayyidina Muhammadin wa 'alaa aalihi wa ashaabihi wa azwaajihi wa dhurriyyatihi wa ahli baytihi 'adada ma fee 'ilmika, salatan da'imatan bidawami mulkik.", meaning: "O Allah, bless our Master Muhammad, his family, companions, wives, offspring, and household, as many times as what exists in Your knowledge, an eternal blessing lasting as long as Your kingdom.", benefit: "Whoever recites this just once, it is as if they have read the entire Dalail al-Khayrat 40 times." },
            { id: "wasyahul_afrah", name: "Salawat Wasyahul Afrah", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ بِعَدَدِ كُلِّ حَرْفٍ جَرَى بِهِ الْقَلَمُ", transliteration: "Allahumma salli 'alaa Sayyidina Muhammadin wa 'alaa aalihi wa sahbihi bi'adadi kulli harfin jara bihil qalam.", meaning: "O Allah, bless our Master Muhammad, his family, and his companions, by the number of every letter ever written by the Divine Pen.", benefit: "Whoever recites this 10 times after Maghrib prayer, before speaking of worldly matters, will pass away in a strong state of Iman (faith)." },
            { id: "awwalin", name: "Sholawat Awwalin", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَ عَلَى آلِ سَيِّدِنَا مُحَمَّدٍ فِي الْأَوَّلِينَ وَ الْآخِرِينَ، وَ فِي الْمَلَإِ الْأَعْلَى إِلَى يَوْمِ الدِّينِ.", transliteration: "Allahumma sholli 'ala sayyidina muhammad wa 'ala aali sayyidina muhammadin fil awwaliin wa l-aakhiriin, wa fil mala'il a'laa ilaa yaumid diin.", meaning: "Ya Allah, bestow blessings upon Sayyidina Muhammad and his family, among the first generations and the last, and in the highest assembly until the Day of Judgment.", benefit: "A profound and comprehensive Salawat encompassing all of time and the highest assemblies." },
            { id: "afdholu_sholawat", name: "Afdholu Sholawat", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ فِي الْأَوَّلِينَ وَصَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ فِي الْآخِرِينَ وَصَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ فِي النَّبِيِّينَ وَصَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ فِي الْمُرْسَلِينَ وَصَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ فِي الْمَلَإِ الْأَعْلَى إِلَى يَوْمِ الدِّينِ", transliteration: "Allahumma salli 'alaa Sayyidina Muhammadin fil awwaleen, wa salli 'alaa Sayyidina Muhammadin fil aakhireen, wa salli 'alaa Sayyidina Muhammadin fin-nabiyyeen, wa salli 'alaa Sayyidina Muhammadin fil mursaleen, wa salli 'alaa Sayyidina Muhammadin fil mala'il a'laa ilaa yawmid-deen.", meaning: "O Allah, bless our Master Muhammad among the firsts, the lasts, the prophets, the messengers, and in the highest assembly until the Day of Judgment.", benefit: "Reciting this 3 times at Subuh and Asr erases sins, brings continuous happiness, and fulfills one's needs." },
            { id: "ahlul_mahabbah", name: "Sholawat Ahlul Mahabbah", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ صَلَاةً تَعْدِلُ جَمِيعَ الصَّلَوَاتِ أَهْلِ مَحَبَّتِكَ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ سَلَامًا يَعْدِلُ سَلَامَهُمْ", transliteration: "Allahumma salli 'alaa Sayyidina Muhammadin wa 'alaa aalihi salatan ta'dilu jamee'a salawaati ahli mahabbatika, wa sallim 'alaa Sayyidina Muhammadin wa 'alaa aalihi salaman ta'dilu salamahum.", meaning: "O Allah, bless our Master Muhammad and his family with a blessing that equals all the blessings sent by the people of Your love, and send peace upon him and his family that equals their peace.", benefit: "Reciting once equals all Salawat of the Awliya. Reciting 8x morning and evening elevates one's spiritual station and invites the spiritual presence of Rasulullah ﷺ." },
            { id: "wishal", name: "Sholawat Al-Wishal", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ صَلَاةً تَلِيقُ بِجَمَالِهِ وَجَلَالِهِ وَكَمَالِهِ وَصَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَأَذِقْنَا بِالصَّلَاةِ عَلَيْهِ لَذَّةَ مُشَاهَدَتِهِ وَوِصَالِهِ", transliteration: "Allahumma salli wa sallim wa baarik 'alaa Sayyidina Muhammadin wa 'alaa aalihi salatan taleequ bijamaalihi wa jalaalihi wa kamaalih. Wa salli wa sallim wa baarik 'alaa Sayyidina Muhammadin wa 'alaa aalihi wa adhiqnaa bis-salaati 'alayhi ladhdhata mushahadatihi wa wisaalih.", meaning: "O Allah, bless, grant peace, and bestow grace upon our Master Muhammad and his family, a blessing befitting his beauty, majesty, and perfection. And make us taste, through our blessings upon him, the sweetness of witnessing him and connecting with him.", benefit: "Specifically recited to taste the sweetness of spiritual closeness and to build a profound inner connection (Wishal) to the Prophet ﷺ." },
            { id: "simple", name: "The Constant Breeze", arabic: "صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ", transliteration: "Sallallahu 'alayhi wa sallam.", meaning: "May the peace and blessings of Allah be upon him.", benefit: "The simplest form, easy to keep moist on your tongue constantly throughout the day." },
            { id: "ibrahimiyyah", name: "Salawat al-Ibrahimiyyah", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ", transliteration: "Allahumma salli 'ala Muhammadin wa 'ala ali Muhammadin kama sallayta 'ala Ibrahima wa 'ala ali Ibrahima innaka hamidun majid.", meaning: "O Allah, send prayers upon Muhammad and upon the family of Muhammad, as You sent prayers upon Ibrahim and upon the family of Ibrahim; You are indeed Praiseworthy and Glorious.", benefit: "The greatest and most authentic form, recited daily in the final part of our formal prayers (Salah)." },
            { id: "tibbiyyah", name: "Salawat al-Tibbiyyah", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ طِبِّ الْقُلُوبِ وَدَوَائِهَا، وَعَافِيَةِ الأَبْدَانِ وَشِفَائِهَا، وَنُورِ الأَبْصَارِ وَضِيَائِهَا، وَقُوتِ الأَرْوَاحِ وَغِذَائِهَا، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ", transliteration: "Allahumma salli 'ala Sayyidina Muhammadin tibbi al-qulubi wa dawaiha, wa 'afiyati al-abdani wa shifaiha, wa nuri al-absari wa diyaiha, wa quti al-arwahi wa ghidhaiha, wa 'ala alihi wa sahbihi wa sallim.", meaning: "O Allah, send blessings upon our Master Muhammad, the medicine of hearts and their cure, the health of bodies and their healing, the light of eyes and their illumination, the nourishment of souls and their diet, and upon his family and companions, and grant them peace.", benefit: "Recited when the heart feels heavy, sick, or lost. It aligns perfectly with verses of emotional healing." },
            { id: "fatih", name: "Salawat al-Fatih", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ الْفَاتِحِ لِمَا أُغْلِقَ، وَالْخَاتِمِ لِمَا سَبَقَ، نَاصِرِ الْحَقِّ بِالْحَقِّ، وَالْهَادِي إِلَى صِرَاطِكَ الْمُسْتَقِيمِ، وَعَلَى آلِهِ حَقَّ قَدْرِهِ وَمِقْدَارِهِ الْعَظِيمِ", transliteration: "Allahumma salli 'ala Sayyidina Muhammadin al-fatihi lima ughliqa, wa al-khatimi lima sabaqa, nasiri al-haqqi bil-haqqi, wa al-hadi ila siratika al-mustaqim, wa 'ala alihi haqqa qadrihi wa miqdarihi al-'azim.", meaning: "O Allah, send blessings upon our Master Muhammad, the opener of what was closed, the seal of what had preceded, the helper of the truth by the Truth, and the guide to Your straight path, and upon his family according to his true stature and immense rank.", benefit: "Recited when you feel stuck in your life, facing a dead-end, or when struggling to understand a verse. It 'opens' closed doors." },
            { id: "munjiyyah", name: "Salawat al-Munjiyyah", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلاَةً تُنْجِينَا بِهَا مِنْ جَمِيعِ الأَهْوَالِ وَالآفَاتِ، وَتَقْضِي لَنَا بِهَا جَمِيعَ الْحَاجَاتِ، وَتُطَهِّرُنَا بِهَا مِنْ جَمِيعِ السَّيِّئَاتِ، وَتَرْفَعُنَا بِهَا عِنْدَكَ أَعْلَى الدَّرَجَاتِ، وَتُبَلِّغُنَا بِهَا أَقْصَى الْغَايَاتِ مِنْ جَمِيعِ الْخَيْرَاتِ فِي الْحَيَاةِ وَبَعْدَ الْمَمَاتِ", transliteration: "Allahumma salli 'ala Sayyidina Muhammadin salatan tunjīna biha min jamī'i al-ahwāli wa al-āfāt, wa taqḍī lanā bihā jamī'a al-ḥājāt, wa tuṭahhirunā bihā min jamī'i as-sayyi'āt, wa tarfa'unā bihā 'indaka a'lā ad-darajāt, wa tuballighunā bihā aqṣā al-ghāyāti min jamī'i al-khayrāti fī al-ḥayāti wa ba'da al-mamāt.", meaning: "O Allah, send blessings upon our Master Muhammad, a blessing by which You save us from all terrors and afflictions, fulfill all our needs, purify us from all sins, raise us to the highest ranks with You, and cause us to reach the ultimate goals of all goodness in life and after death.", benefit: "A profound prayer of rescue. Recited during times of extreme hardship, anxiety, or when seeking deliverance from overwhelming situations." },
            { id: "asar_jumaat", name: "Selawat Asar Jumaat", arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ النَّبِيِّ الأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ تَسْلِيمًا", transliteration: "Allahumma salli 'ala Sayyidina Muhammadin 'abdika wa rasulikan-nabiyyil-ummiyyi wa 'ala aalihi wa sahbihi wa sallim taslima.", meaning: "O Allah, bestow blessings and peace of respect upon our Master Muhammad, Your servant and Messenger, the unlettered Prophet, and upon his family and companions.", benefit: "Abu Hurairah (RA) narrated: Whoever reads this salawat 80 times right after the Asar prayer on Friday, before getting up from their prayer place, Allah will forgive their sins for 80 years and reward them with 80 years of worship." },
            { id: "adrikni", name: "Salutation of Help (Adrikni)", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ ❁ قَدْ ضَاقَتْ حِيلَتِي أَدْرِكْنِي يَا رَسُولَ اللَّهِ ❁", transliteration: "Allāhumma ṣalli wa sallim ʿalā Sayyidinā Muḥammadin, qad ḍāqat ḥīlatī adriknī yā rasūla Llāh.", meaning: "O Allah, send prayers and peace upon our master Muhammad. My situation has become weak - come to my aid, O Messenger of Allah!", benefit: "A deeply emotional plea for help. Recited during times of extreme distress, helplessness, or crisis when all worldly means seem cut off." },
            { id: "nur_habib_ali", name: "Sholawat Nur (Habib Ali Al Habsyi)", arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ، وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، بِاللِّسَانِ الْجَامِعَةِ، فِي الْحَضْرَةِ الْوَاسِعَةِ، صَلَاةً تُمِدُّبِهَا جِسْمِي مِنْ جِسْمِهِ، وَقَلْبِي مِنْ قَلْبِهِ، وَرُوْحِي مِنْ رُوْحِهِ، وَسِرِّي مِنْ سِرِّهِ، وَعِلْمِي مِنْ عِلْمِهِ، وَعَمَلِي مِنْ عَمَلِهِ، وَخُلُقِي مِنْ خُلُقِهِ، وَنِيَّتِي مِنْ نِيَّتِهِ، وَوِجْهَتِي مِنْ وَجْهَتِهِ، وَقَصْدِي مِنْ قَصْدِهِ، وَتَعُوْدُ بَرَكَاتُهَا عَلَيَّ وَعَلَى أَوْلَادِي، وَعَلَى أَهْلِي وَعَلَى أَصْحَابِي، وَعَلَى أَهْلِ عَصْرِي، يَانُوْرُ... يَانُوْرُ... يَانُوْرُ...، اِجْعَلْنِي نُوْرًا بِحَقِّ النُّوْرِ", transliteration: "Allahumma salli wa sallim 'ala Sayyidina Muhammad, wa 'ala aali Sayyidina Muhammad, bil-lisanil jami'ati, fil-hadhratil wasi'ati, shalatan tumiddubiha jismi min jismihi, wa qalbi min qalbihi, wa ruhi min ruhihi, wa sirri min sirrihi, wa 'ilmi min 'ilmihi, wa 'amali min 'amalihi, wa khuluqi min khuluqihi, wa niyyati min niyyatihi, wa wijhati min wijhatihi, wa qashdi min qashdihi, wa ta'udu barakatuha 'alayya wa 'ala awladi, wa 'ala ahli wa 'ala ashabi, wa 'ala ahli 'ashri, Ya Nuur... Ya Nuur... Ya Nuur... ij'alni nuuran bihaqqin-nuur.", meaning: "O Allah, bestow blessings and peace upon our Master Muhammad and his family, with the all-encompassing tongue, in the vast divine presence. A blessing through which my body draws from his body, my heart from his heart, my soul from his soul, my secret from his secret, my knowledge from his knowledge, my actions from his actions, my character from his character, my intentions from his intentions, my direction from his direction, and my purpose from his purpose... O Light... make me light, by the right of The Light.", benefit: "Authored by Habib Ali bin Muhammad Al Habsyi. It is a profound prayer to align one's entire being with the perfection and light of the Prophet ﷺ." },
            { id: "busyro", name: "Shalawat Busyro", arabic: "اَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ صَاحِبِ الْبُشْرَى صَلَاةً تُبَشِّرُنَا بِهَا وَأَهْلَنَا وَأَوْلَادَنَا وَجَمِيعَ مَشَايِخِنَا وَمُعَلِّمِينَا وَطَلَبَتَنَا وَطَالِبَاتِنَا مِنْ يَوْمِنَا هَذَا إِلَى يَوْمِ الْآخِرَةِ", transliteration: "Allahumma sholli wa sallim 'ala Sayyidina Muhammadin shoohibil busyro sholaatan tubasysyiruna bihaa wa ahlanaa wa awlaadanaa wa jamii'a masyaayikhinaa wa mu'allimiinaa wa tholabatanaa wa thoolibaatinaa min yauminaa haadzaa ilaa yaumil aakhiroh.", meaning: "O Allah, grant blessings and peace to our Master Muhammad, the bearer of glad tidings, with a blessing by which You bring glad tidings to us, our families, our children, all our teachers, our instructors, and all our students (male and female), from this day of ours until the Day of Hereafter.", benefit: "Recite 41x every morning after Subuh prayer. Its benefits include smoothing sustenance, bringing joy and happiness, easing all affairs, and fulfilling all needs and intentions." }
          ];

          const haptic = (pattern) => {

            window.RuhSoundscape.onBeadClick();
            setSalawatCounts(prev => ({...prev, [id]: (prev[id] || 0) + 1}));
            setTotalSalawatToday(prev => {
              const next = prev + 1;
              if ([10, 33, 100, 500, 1000].includes(next)) {
                haptic([10, 50, 10, 50, 20]);
                // Play milestone chime (slight delay so haptic and chime feel distinct)
                setTimeout(() => window.RuhSoundscape.onMilestone(), 180);

            });
            setLastSalawatId(id);

            // Compute new counts to detect first-time all-shields completion
            const newCounts = {...protectionCounts, [id]: (protectionCounts[id] || 0) + 1};
            const wasAllRaised = protectionCollection.every(d => (protectionCounts[d.id] || 0) > 0);
            const allRaised = protectionCollection.every(d => (newCounts[d.id] || 0) > 0);
            setProtectionCounts(newCounts);

          // ─── Diary: Share / Save reflections ─────────────────────────────────
          // Uses the native Web Share API so users can send to iMessage, WhatsApp,
          // Notes, iCloud, etc — familiar to everyone regardless of age.
          // Falls back to clipboard copy on browsers that don't support sharing.
          const handleShareDiary = async () => {
            if (diaryEntries.length === 0) return;

            const formatted = diaryEntries.map(entry => {
              const source = entry.surah !== 'General Reflection'
                ? `${entry.surah}${entry.ayah !== '—' ? ` · ${entry.ayah}` : ''}`
                : 'General Reflection';
              return `${entry.date}  |  ${source}\n"${entry.text}"`;
            }).join('\n\n— — —\n\n');

            const shareText = `My Rūḥ Reflections\n${'─'.repeat(28)}\n\n${formatted}`;

            try {
              if (navigator.share) {
                // Mobile (iOS / Android / macOS Safari):
                // Opens the native share sheet — iMessage, WhatsApp, Notes, Files, email…
                await navigator.share({ title: 'My Rūḥ Reflections', text: shareText });
              } else {
                // Desktop fallback (Windows, macOS Chrome/Firefox):
                // Download as a plain .txt file — universally understood on every OS.
                const blob = new Blob([shareText], { type: 'text/plain;charset=utf-8' });
                const url  = URL.createObjectURL(blob);
                const a    = document.createElement('a');
                a.href     = url;
                a.download = `ruh-reflections-${new Date().toISOString().slice(0, 10)}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Your reflections have been saved as a text file.', 'success');
              }
            } catch (err) {
              // User cancelled the share sheet — not an error worth surfacing
              if (err.name !== 'AbortError') {
                console.error('[Rūḥ] Share error:', err.message);
                showToast('Could not save reflections. Please try again.', 'error');
              }
            }
          };

          // ─── Diary: Tech-savvy backup (JSON) ──────────────────────────────────
          // Hidden from main UI. Kept for power users who know what they're doing
          // and import their backup. Used by handleImportDiary below.
          const _exportDiaryJson = () => {
            if (diaryEntries.length === 0) return;
            const exportData = {
              exportedAt: new Date().toISOString(),
              appVersion: 'Rūḥ',
              entryCount: diaryEntries.length,
              entries: diaryEntries,
            };
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ruh-diary-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          };

          // ─── Diary Backup: Import ─────────────────────────────────────────────
          // Restores diary entries from a previously exported JSON file.
          // Merges by ID so duplicates are never created.
          // Validates file size and every entry's fields before touching state.

          /** Returns true if the entry has all required fields with correct types. @param {any} e */
          const isValidEntry = (e) =>
            e !== null &&
            typeof e === 'object' &&
            typeof e.id   === 'number' &&
            typeof e.date === 'string' && e.date.length > 0 && e.date.length <= 40 &&
            typeof e.surah=== 'string' && e.surah.length > 0 && e.surah.length <= 120 &&
            typeof e.ayah === 'string' && e.ayah.length > 0 && e.ayah.length <= 20 &&
            typeof e.text === 'string' && e.text.length > 0 && e.text.length <= 5000;

          const handleImportDiary = (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            // Guard: reject files larger than 5 MB to prevent main-thread freeze
            const MAX_BYTES = 5 * 1024 * 1024;
            if (file.size > MAX_BYTES) {
              showToast('That file is too large. Please use a valid Rūḥ backup (max 5 MB).', 'error');
              e.target.value = '';
              return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const parsed = JSON.parse(event.target.result);

                if (!parsed.entries || !Array.isArray(parsed.entries)) {
                  throw new Error('Missing "entries" array.');
                }

                // Validate each entry's shape before trusting it
                const validEntries = parsed.entries.filter(isValidEntry);
                const skipped = parsed.entries.length - validEntries.length;

                const existingIds = new Set(diaryEntries.map(entry => entry.id));
                const newEntries = validEntries.filter(entry => !existingIds.has(entry.id));

                if (newEntries.length === 0 && skipped === 0) {
                  showToast('All entries in this backup are already in your diary.', 'info');
                  return;
                }
                if (newEntries.length === 0 && skipped > 0) {
                  showToast(`${skipped} entr${skipped === 1 ? 'y' : 'ies'} could not be restored — invalid format.`, 'error');
                  return;
                }

                // Safe to merge — entries are validated
                setDiaryEntries(prev => [...newEntries, ...prev].sort((a, b) => b.id - a.id));
                const msg = skipped > 0
                  ? `${newEntries.length} reflection${newEntries.length === 1 ? '' : 's'} restored. ${skipped} skipped (invalid format).`
                  : `${newEntries.length} reflection${newEntries.length === 1 ? '' : 's'} restored successfully.`;
                showToast(msg, 'success');

              } catch (err) {
                showToast('Could not read the backup file. Please make sure it is a valid Rūḥ export.', 'error');
                console.error('[Rūḥ] Import error:', err.message);
              }
            };
            reader.readAsText(file);
            // Reset so the same file can be re-imported if needed
            e.target.value = '';
          };

            entry.text.toLowerCase().includes(searchQuery.toLowerCase()) ||

            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return `${months[now.getMonth()]} ${now.getDate()},`;
          })();
          const onThisDayEntries = diaryEntries.filter(entry => {
            // Match "Mar 22," at the start of the date string (excludes current year's "today" entries)
            if (!entry.date.startsWith(todayMMDD)) return false;
            // Exclude entries saved today
            const entryYear = parseInt(entry.date.slice(-4), 10);
            return entryYear < new Date().getFullYear();

            <div className="app-viewport w-full flex justify-center bg-parchment dark:bg-slate-950 transition-colors duration-500">

                  style={{

                    <circle className="star-draw" cx="60" cy="60" r="20"

                  {/* Step 2 — Name entry */}
                  {onboardingStep === 2 && (
